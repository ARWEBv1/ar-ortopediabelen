<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tanjiro Dragon Energy</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>

body{
margin:0;
overflow:hidden;
background:radial-gradient(circle,#001a2d,#000);
}

model-viewer{
width:100vw;
height:100vh;
}

</style>
</head>

<body>

<model-viewer
id="dragon"
src="./Tanjiro1.glb"
ios-src="./Tanjiro1.usdc"
camera-controls
exposure="2"
shadow-intensity="1"
environment-image="neutral">

</model-viewer>

<script>

const model=document.querySelector("#dragon")

model.addEventListener("load",()=>{

const materials=model.model.materials

const cuerpo=materials.find(m=>m.name.toLowerCase().includes("cuerpo"))
const crestas=materials.find(m=>m.name.toLowerCase().includes("agua cuerpo"))
const cabeza=materials.find(m=>m.name.toLowerCase().includes("cabeza"))
const ojos=materials.find(m=>m.name.toLowerCase().includes("ojos"))

const piso=materials.find(m=>
m.name==="Material.005"||
m.name==="Material.008"||
m.name.toLowerCase().includes("water")
)

let t=0

function animate(){

t+=0.08

// energía que viaja como ola
let wave=(Math.sin(t)+1)/2
let wave2=(Math.sin(t+1.5)+1)/2
let wave3=(Math.sin(t+3)+1)/2

// cuerpo oscuro + brillo viajando
if(cuerpo){

cuerpo.emissiveFactor=[
0,
wave*2,
wave*3
]

}

// crestas brillan después
if(crestas){

crestas.emissiveFactor=[
0.2,
wave2*3,
wave2*4
]

}

// cabeza recibe energía final
if(cabeza){

cabeza.emissiveFactor=[
0.4,
wave3*4,
wave3*5
]

}

// ojos brillan intermitente
if(ojos){

let blink=(Math.sin(t*3)+1)/2

ojos.emissiveFactor=[
1,
blink*5,
blink*5
]

}

// RGB fuerte en piso

if(piso){

let r=(Math.sin(t*0.7)+1)/2
let g=(Math.sin(t*0.7+2)+1)/2
let b=(Math.sin(t*0.7+4)+1)/2

// emisión fuerte visible
piso.emissiveFactor=[
r*4,
g*4,
b*4
]

piso.pbrMetallicRoughness.setBaseColorFactor([
r*0.6,
g*0.6,
b*0.8,
1
])

}

requestAnimationFrame(animate)

}

animate()

})

</script>

</body>
</html>
