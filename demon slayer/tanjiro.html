<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tanjiro Dragon Energy</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>

body{
margin:0;
overflow:hidden;
background:radial-gradient(circle,#001a2d,#000);
}

model-viewer{
width:100vw;
height:100vh;
}

</style>
</head>

<body>

<model-viewer
id="dragon"
src="./Tanjiro1.glb"
ios-src="./Tanjiro1.usdc"
camera-controls
exposure="2"
shadow-intensity="1"
environment-image="neutral">

</model-viewer>

<script>

const model=document.querySelector("#dragon")

model.addEventListener("load",()=>{

const materials=model.model.materials

// materiales confirmados
const boca=materials.find(m=>m.name==="dragon boca")
const cabeza=materials.find(m=>m.name==="dragon cabeza")
const cuerpo=materials.find(m=>m.name==="dragon cuerpo largo")

// piso RGB
const piso=materials.find(m=>m.name==="Material.005")

let t=0

function animate(){

t+=0.08

// energía que viaja por el dragón
let energia1=(Math.sin(t)+1)/2
let energia2=(Math.sin(t+1.5)+1)/2
let energia3=(Math.sin(t+3)+1)/2

// cuerpo (base)
if(cuerpo){

cuerpo.emissiveFactor=[
0,
energia1*2,
energia1*3
]

}

// cabeza (recibe energía después)
if(cabeza){

cabeza.emissiveFactor=[
0.2,
energia2*3,
energia2*4
]

}

// boca (explosión de energía)
if(boca){

boca.emissiveFactor=[
0.5,
energia3*4,
energia3*5
]

}

// RGB en el piso

if(piso){

let r=(Math.sin(t*0.7)+1)/2
let g=(Math.sin(t*0.7+2)+1)/2
let b=(Math.sin(t*0.7+4)+1)/2

piso.pbrMetallicRoughness.setBaseColorFactor([
r,
g,
b,
1
])

piso.emissiveFactor=[
r*3,
g*3,
b*3
]

}

requestAnimationFrame(animate)

}

animate()

})

</script>

</body>
</html>
