<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tanjiro Water Dragon Cinematic</title>

<style>
body{
margin:0;
overflow:hidden;
background:black;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/postprocessing/UnrealBloomPass.js"></script>

</head>

<body>

<script>

let scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

let camera = new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.1,
100
);

camera.position.set(0,1.5,4);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

let controls = new THREE.OrbitControls(camera,renderer.domElement);

let ambient = new THREE.AmbientLight(0xffffff,2);
scene.add(ambient);

let light = new THREE.DirectionalLight(0xffffff,2);
light.position.set(5,5,5);
scene.add(light);

let boca,cabeza,cuerpo;

let loader = new THREE.GLTFLoader();

loader.load("Tanjiro1.glb",function(gltf){

let model=gltf.scene;
scene.add(model);

// centrar modelo
let box=new THREE.Box3().setFromObject(model);
let center=box.getCenter(new THREE.Vector3());
model.position.sub(center);

// detectar partes
model.traverse(function(obj){

if(obj.isMesh){

let n=obj.name.toLowerCase();

if(n.includes("dragon boca")) boca=obj;
if(n.includes("dragon cabeza")) cabeza=obj;
if(n.includes("dragon cuerpo largo")) cuerpo=obj;

}

});

});

// bloom
let composer = new THREE.EffectComposer(renderer);

let renderPass = new THREE.RenderPass(scene,camera);
composer.addPass(renderPass);

let bloomPass = new THREE.UnrealBloomPass(
new THREE.Vector2(window.innerWidth,window.innerHeight),
1.5,
0.4,
0.1
);

composer.addPass(bloomPass);

// colores agua
let colors=[
new THREE.Color(0.6,0.9,1),
new THREE.Color(0.2,0.5,1),
new THREE.Color(0,1,0.9),
new THREE.Color(1,1,1),
new THREE.Color(0.05,0.1,0.4)
];

function getColor(t){
return colors[Math.floor(t)%colors.length];
}

// partículas agua
let particlesGeometry=new THREE.BufferGeometry();
let particleCount=300;

let positions=[];

for(let i=0;i<particleCount;i++){

positions.push(
(Math.random()-0.5)*4,
Math.random()*2,
(Math.random()-0.5)*4
)

}

particlesGeometry.setAttribute(
'position',
new THREE.Float32BufferAttribute(positions,3)
);

let particlesMaterial=new THREE.PointsMaterial({
color:0x66ccff,
size:0.03
});

let particleSystem=new THREE.Points(particlesGeometry,particlesMaterial);
scene.add(particleSystem);

// piso ondas
let floorGeometry=new THREE.PlaneGeometry(10,10,60,60);
let floorMaterial=new THREE.MeshBasicMaterial({
color:0x001a2d,
wireframe:true
});

let floor=new THREE.Mesh(floorGeometry,floorMaterial);
floor.rotation.x=-Math.PI/2;
floor.position.y=-1;
scene.add(floor);

let clock=new THREE.Clock();

function animate(){

requestAnimationFrame(animate);

let t=clock.getElapsedTime();

let e1=(Math.sin(t)+1)/2;
let e2=(Math.sin(t-1)+1)/2;
let e3=(Math.sin(t-2)+1)/2;

// energía dragón
if(boca){
boca.material.color.copy(getColor(t)).multiplyScalar(e1+0.5);
}

if(cabeza){
cabeza.material.color.copy(getColor(t-1)).multiplyScalar(e2+0.5);
}

if(cuerpo){
cuerpo.material.color.copy(getColor(t-2)).multiplyScalar(e3+0.5);
}

// partículas
particleSystem.rotation.y += 0.002;

// ondas piso
let verts=floor.geometry.attributes.position;

for(let i=0;i<verts.count;i++){

let x=verts.getX(i);
let wave=Math.sin(x*2+t)*0.15;

verts.setZ(i,wave);

}

verts.needsUpdate=true;

controls.update();
composer.render();

}

animate();

</script>

</body>
</html>
