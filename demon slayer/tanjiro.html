<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Material Scanner</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>

body{
margin:0;
background:black;
}

model-viewer{
width:100vw;
height:100vh;
}

</style>
</head>

<body>

<model-viewer
id="dragon"
src="./Tanjiro1.glb"
camera-controls
exposure="2"
shadow-intensity="1"
environment-image="neutral">
</model-viewer>

<script>

const model=document.querySelector("#dragon")

model.addEventListener("load",()=>{

const materials=model.model.materials

console.log("MATERIALES DETECTADOS")

materials.forEach((m,i)=>{

console.log(i,m.name)

})

let index=0

function scan(){

// reset todos
materials.forEach(m=>{
m.emissiveFactor=[0,0,0]
})

// ilumina uno
let mat=materials[index]

if(mat){

mat.emissiveFactor=[5,0,0]

console.log("Material activo:",index,mat.name)

}

index++

if(index>=materials.length){

index=0

}

setTimeout(scan,1500)

}

scan()

})

</script>

</body>
</html>
