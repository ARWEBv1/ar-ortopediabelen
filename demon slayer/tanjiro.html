<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tanjiro Water Dragon Energy</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>

body{
margin:0;
overflow:hidden;
background:radial-gradient(circle,#001a2d,#000);
}

model-viewer{
width:100vw;
height:100vh;
}

</style>
</head>

<body>

<model-viewer
id="dragon"
src="./Tanjiro1.glb"
ios-src="./Tanjiro1.usdc"
camera-controls
exposure="2"
shadow-intensity="1"
environment-image="neutral">
</model-viewer>

<script>

const model=document.querySelector("#dragon")

model.addEventListener("load",()=>{

const materials=model.model.materials

const boca=materials.find(m=>m.name==="dragon boca")
const cabeza=materials.find(m=>m.name==="dragon cabeza")
const cuerpo=materials.find(m=>m.name==="dragon cuerpo largo")

let t=0

function waterColor(t){

let r = 0.3 + Math.sin(t)*0.2
let g = 0.7 + Math.sin(t+1)*0.2
let b = 1

return [r,g,b]

}

function animate(){

t += 0.06

// retrasos para crear movimiento de energía
let faseBoca = t
let faseCabeza = t - 1.2
let faseCuerpo = t - 2.4

// boca (inicio energía)
if(boca){

let intensidad = (Math.sin(faseBoca)+1)/2
let color = waterColor(faseBoca)

boca.emissiveFactor = [
color[0]*intensidad*4,
color[1]*intensidad*4,
color[2]*intensidad*4
]

}

// cabeza (energía después)
if(cabeza){

let intensidad = (Math.sin(faseCabeza)+1)/2
let color = waterColor(faseCabeza)

cabeza.emissiveFactor = [
color[0]*intensidad*3,
color[1]*intensidad*3,
color[2]*intensidad*3
]

}

// cuerpo largo (última ola)
if(cuerpo){

let intensidad = (Math.sin(faseCuerpo)+1)/2
let color = waterColor(faseCuerpo)

cuerpo.emissiveFactor = [
color[0]*intensidad*2,
color[1]*intensidad*2,
color[2]*intensidad*2
]

}

requestAnimationFrame(animate)

}

animate()

})

</script>

</body>
</html>
