<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tanjiro Dragon Energy</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>

body{
margin:0;
overflow:hidden;
background:radial-gradient(circle,#001a2d,#000);
}

model-viewer{
width:100vw;
height:100vh;
}

</style>
</head>

<body>

<model-viewer
id="dragon"
src="./Tanjiro1.glb"
ios-src="./Tanjiro1.usdc"
camera-controls
exposure="1.8"
shadow-intensity="1"
environment-image="neutral">

</model-viewer>

<script>

const model=document.querySelector("#dragon")

model.addEventListener("load",()=>{

const materials=model.model.materials

console.log("Materiales:")
materials.forEach(m=>console.log(m.name))

const cuerpo=materials.find(m=>m.name.toLowerCase().includes("cuerpo"))
const crestas=materials.find(m=>m.name.toLowerCase().includes("agua cuerpo"))
const cabeza=materials.find(m=>m.name.toLowerCase().includes("cabeza"))
const ojos=materials.find(m=>m.name.toLowerCase().includes("ojos"))

const piso=materials.find(m=>
m.name==="Material.005"||
m.name==="Material.008"||
m.name.toLowerCase().includes("water")
)

let t=0

function animate(){

t+=0.05

// energía que rota por el dragón
let sector1=(Math.sin(t)+1)/2
let sector2=(Math.sin(t+2)+1)/2
let sector3=(Math.sin(t+4)+1)/2

// CUERPO
if(cuerpo){

cuerpo.emissiveFactor=[
0,
sector1*1.5,
sector2*2
]

}

// CRESTAS
if(crestas){

crestas.emissiveFactor=[
0.3,
sector2*2,
sector3*2
]

}

// CABEZA
if(cabeza){

cabeza.emissiveFactor=[
0.4,
sector3*2,
sector1*2
]

}

// OJOS
if(ojos){

ojos.emissiveFactor=[
0.7,
sector1*3,
sector2*3
]

}

// RGB EN EL PISO

if(piso){

let r=(Math.sin(t)+1)/2
let g=(Math.sin(t+2)+1)/2
let b=(Math.sin(t+4)+1)/2

piso.emissiveFactor=[
r*2,
g*2,
b*2
]

piso.pbrMetallicRoughness.setBaseColorFactor([
r*0.4,
g*0.4,
b*0.6,
1
])

}

requestAnimationFrame(animate)

}

animate()

})

</script>

</body>
</html>
