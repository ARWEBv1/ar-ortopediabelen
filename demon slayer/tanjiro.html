<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tanjiro Dragon Control</title>

<style>
body{
margin:0;
overflow:hidden;
background:black;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

</head>

<body>

<script>

let scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

let camera = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,100);
camera.position.set(0,1.5,4);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

let controls = new THREE.OrbitControls(camera,renderer.domElement);

let ambient = new THREE.AmbientLight(0xffffff,2);
scene.add(ambient);

let light = new THREE.DirectionalLight(0xffffff,2);
light.position.set(5,5,5);
scene.add(light);

// DRAGON
let dragonParts = [];
let dragonFloor = null;
let dragonVisible = false;

let loader = new THREE.GLTFLoader();

loader.load("Tanjiro1.glb",(gltf)=>{

let model = gltf.scene;
scene.add(model);

// centrar modelo
let box=new THREE.Box3().setFromObject(model);
let center=box.getCenter(new THREE.Vector3());
model.position.sub(center);

// buscar piezas
model.traverse((obj)=>{

if(obj.isMesh){

let n = obj.name.toLowerCase();

if(
n.includes("dragon boca") ||
n.includes("dragon cabeza") ||
n.includes("dragon cuerpo largo") ||
n.includes("dragon dientes") ||
n.includes("dragon ojos") ||
n.includes("flash")
){

dragonParts.push(obj);

// ocultar dragón al inicio
obj.visible = false;

}

if(n.includes("dragon agua piso")){
dragonFloor = obj;
}

}

});

});

// colores agua
let colors=[
new THREE.Color(0.6,0.9,1),
new THREE.Color(0.2,0.5,1),
new THREE.Color(0,1,0.9),
new THREE.Color(1,1,1),
new THREE.Color(0.05,0.1,0.4)
];

function getColor(t){
return colors[Math.floor(t)%colors.length];
}

let clock = new THREE.Clock();

// activar dragón con click
window.addEventListener("click",()=>{

dragonVisible = true;

dragonParts.forEach(part=>{
part.visible = true;
});

});

function animate(){

requestAnimationFrame(animate);

let t = clock.getElapsedTime();

if(dragonVisible){

let energy=(Math.sin(t*2)+1)/2;

dragonParts.forEach(part=>{

part.material.emissive = new THREE.Color(0x66ccff);
part.material.emissiveIntensity = energy*2;

part.material.color.copy(getColor(t)).multiplyScalar(energy+0.3);

});

}

// RGB piso dragón
if(dragonFloor){

let r=(Math.sin(t)+1)/2;
let g=(Math.sin(t+2)+1)/2;
let b=(Math.sin(t+4)+1)/2;

dragonFloor.material.color.setRGB(r,g,b);

}

// leve movimiento del dragón
dragonParts.forEach((part)=>{
part.rotation.z = Math.sin(t)*0.02;
});

controls.update();
renderer.render(scene,camera);

}

animate();

</script>

</body>
</html>
