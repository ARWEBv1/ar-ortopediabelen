<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Water Dragon Energy</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
body{
margin:0;
background:black;
}

model-viewer{
width:100vw;
height:100vh;
}
</style>
</head>

<body>

<model-viewer
id="dragon"
src="./Tanjiro1.glb"
camera-controls
environment-image="neutral"
exposure="1.8">
</model-viewer>

<script>

const model=document.querySelector("#dragon")

model.addEventListener("load",()=>{

const materials=model.model.materials

// detectar materiales correctamente
const boca=materials.find(m=>m.name.toLowerCase().includes("dragon boca"))
const cabeza=materials.find(m=>m.name.toLowerCase().includes("dragon cabeza"))
const cuerpo=materials.find(m=>m.name.toLowerCase().includes("dragon cuerpo largo"))

console.log("boca:",boca)
console.log("cabeza:",cabeza)
console.log("cuerpo:",cuerpo)

let t=0

// colores agua
const colores=[
[0.6,0.9,1],   // celeste
[0.2,0.5,1],   // azul
[0.05,0.1,0.4],// azul marino
[1,1,1],       // blanco
[0,1,0.9]      // calipso
]

function getColor(time){

let i=Math.floor(time)%colores.length
return colores[i]

}

function animate(){

t+=0.05

let faseBoca=t
let faseCabeza=t-1
let faseCuerpo=t-2

if(boca){
let c=getColor(faseBoca)
boca.pbrMetallicRoughness.setBaseColorFactor([c[0],c[1],c[2],1])
}

if(cabeza){
let c=getColor(faseCabeza)
cabeza.pbrMetallicRoughness.setBaseColorFactor([c[0],c[1],c[2],1])
}

if(cuerpo){
let c=getColor(faseCuerpo)
cuerpo.pbrMetallicRoughness.setBaseColorFactor([c[0],c[1],c[2],1])
}

requestAnimationFrame(animate)

}

animate()

})

</script>

</body>
</html>
