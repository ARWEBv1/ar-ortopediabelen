<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tanjiro Water Dragon</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>

body{
margin:0;
background:radial-gradient(circle,#001a2d,#000);
}

model-viewer{
width:100vw;
height:100vh;
}

</style>
</head>

<body>

<model-viewer
id="dragon"
src="./Tanjiro1.glb"
ios-src="./Tanjiro1.usdc"
camera-controls
environment-image="neutral"
exposure="1.8">
</model-viewer>

<script>

const model=document.querySelector("#dragon")

model.addEventListener("load",()=>{

const materials=model.model.materials

const boca=materials.find(m=>m.name==="dragon boca")
const cabeza=materials.find(m=>m.name==="dragon cabeza")
const cuerpo=materials.find(m=>m.name==="dragon cuerpo largo")

let t=0

function waterPalette(v){

// paleta agua
let celeste=[0.4,0.8,1]
let azul=[0.2,0.4,1]
let marino=[0.05,0.1,0.5]
let blanco=[1,1,1]
let calipso=[0,1,0.9]

let colores=[celeste,azul,marino,blanco,calipso]

let i=Math.floor(v)%colores.length

return colores[i]

}

function animate(){

t+=0.06

// fases para que la energía viaje
let faseBoca=t
let faseCabeza=t-1.5
let faseCuerpo=t-3

// boca
if(boca){

let color=waterPalette(faseBoca)

boca.pbrMetallicRoughness.setBaseColorFactor([
color[0],
color[1],
color[2],
1
])

}

// cabeza
if(cabeza){

let color=waterPalette(faseCabeza)

cabeza.pbrMetallicRoughness.setBaseColorFactor([
color[0],
color[1],
color[2],
1
])

}

// cuerpo largo
if(cuerpo){

let color=waterPalette(faseCuerpo)

cuerpo.pbrMetallicRoughness.setBaseColorFactor([
color[0],
color[1],
color[2],
1
])

}

requestAnimationFrame(animate)

}

animate()

})

</script>

</body>
</html>
