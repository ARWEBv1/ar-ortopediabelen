<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tanjiro Dragon Energy</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
body{
  margin:0;
  background:black;
  overflow:hidden;
}
model-viewer{
  width:100vw;
  height:100vh;
}
</style>
</head>

<body>

<model-viewer
  id="dragon"
  src="./Tanjiro1.glb"
  ios-src="./Tanjiro1.usdc"
  ar
  camera-controls
  exposure="1.4"
  shadow-intensity="1"
  environment-image="neutral">
</model-viewer>

<script>
const model = document.querySelector("#dragon");

let chargeLevel = 0;
let charging = false;

model.addEventListener("click", () => {
  charging = true;
  chargeLevel = 0;
});

model.addEventListener("load", () => {

  const materials = model.model.materials;

  const cuerpo = materials.find(m => m.name.toLowerCase().includes("cuerpo"));
  const crestas = materials.find(m => m.name.toLowerCase().includes("agua cuerpo"));
  const cabeza = materials.find(m => m.name.toLowerCase().includes("cabeza"));
  const ojos = materials.find(m => m.name.toLowerCase().includes("ojos"));

  let t = 0;

  function animate() {
    t += 0.05;

    // 🌊 ONDA RECORRIENDO EL CUERPO
    const wave = (Math.sin(t) + 1) / 2;

    if (cuerpo) {
      cuerpo.emissiveFactor = [
        0,
        0.4 * wave + chargeLevel,
        0.9 * wave + chargeLevel
      ];
    }

    if (crestas) {
      crestas.emissiveFactor = [
        0.2 + chargeLevel,
        1.2 * wave + chargeLevel,
        1
      ];
    }

    if (cabeza) {
      cabeza.emissiveFactor = [
        0.3 + chargeLevel,
        1.5 * wave + chargeLevel,
        1.2
      ];
    }

    if (ojos) {
      ojos.emissiveFactor = [
        0.5 + chargeLevel,
        2 * wave + chargeLevel * 2,
        2
      ];
    }

    // ⚡ MODO CARGA AL HACER CLICK
    if (charging) {
      chargeLevel += 0.02;

      if (chargeLevel > 1.5) {
        charging = false;

        // pequeña explosión luminosa
        if (cuerpo) cuerpo.emissiveFactor = [0, 3, 4];
        if (crestas) crestas.emissiveFactor = [1, 4, 4];
        if (cabeza) cabeza.emissiveFactor = [1, 5, 5];
        if (ojos) ojos.emissiveFactor = [2, 6, 6];

        setTimeout(() => {
          chargeLevel = 0;
        }, 300);
      }
    }

    requestAnimationFrame(animate);
  }

  animate();
});
</script>

</body>
</html>
