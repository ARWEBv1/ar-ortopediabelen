<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kid Buu Chaos AR</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>
html, body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:black;
}

#scene{
  width:100%;
  height:100%;
  animation: chaos 0.06s infinite;
}

@keyframes chaos{
  0% { transform: translate(0,0); }
  25% { transform: translate(2px,-2px); }
  50% { transform: translate(-2px,2px); }
  75% { transform: translate(2px,2px); }
  100% { transform: translate(-2px,-2px); }
}

#aura{
  position:absolute;
  inset:0;
  pointer-events:none;
  background: radial-gradient(circle, rgba(255,0,120,0.2), transparent 70%);
  animation: pulse 1s infinite;
}

@keyframes pulse{
  0% { opacity:0.2; transform:scale(1); }
  50% { opacity:0.7; transform:scale(1.07); }
  100% { opacity:0.2; transform:scale(1); }
}

model-viewer{
  width:100%;
  height:100%;
}
</style>
</head>

<body>

<div id="scene">

<model-viewer
  src="./kidbuu1.glb"
  ar
  ar-modes="webxr scene-viewer quick-look"
  camera-controls
  auto-rotate
  environment-image="neutral"
  exposure="2"
  shadow-intensity="1"
  camera-orbit="0deg 75deg 2m"
  field-of-view="35deg">
</model-viewer>

</div>

<div id="aura"></div>
