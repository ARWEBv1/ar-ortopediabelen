<!DOCTYPE html>
<html>
<body style="margin:0;overflow:hidden;background:black">

<script src="https://cdn.jsdelivr.net/npm/three@0.159/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.159/examples/js/loaders/GLTFLoader.js"></script>

<script>

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.001,10000);
camera.position.set(0,1,5);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// 🌞 LUZ EXTREMA (para ver sí o sí)
scene.add(new THREE.AmbientLight(0xffffff,5));

const light = new THREE.DirectionalLight(0xffffff,5);
light.position.set(5,10,5);
scene.add(light);

const loader = new THREE.GLTFLoader();

loader.load(
"/ar-ortopediabelen/kidbuu/kidbuu1.glb",

(gltf)=>{

  const model = gltf.scene;

  // 🔥 FORZAR MATERIAL VISIBLE
  model.traverse((obj)=>{
    if(obj.isMesh){
      obj.material = new THREE.MeshNormalMaterial();
    }
  });

  scene.add(model);

  // AUTO CENTER + ZOOM
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());

  model.position.sub(center);

  const maxDim = Math.max(size.x,size.y,size.z);

  camera.position.z = maxDim * 1.5;
  camera.lookAt(0,0,0);

  console.log("🔥 MODELO FORZADO VISIBLE");

},

undefined,

(err)=>console.error(err)

);

function animate(){
 requestAnimationFrame(animate);
 renderer.render(scene,camera);
}
animate();

</script>
</body>
</html>
