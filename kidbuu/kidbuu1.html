<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kid Buu REAL Sphere</title>
<style>
body{margin:0;overflow:hidden;background:#111;}
</style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

let model;
let energySphere;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(
60,
innerWidth/innerHeight,
0.01,
1000
);

camera.position.set(0,1,4);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;

// luces
scene.add(new THREE.AmbientLight(0xffffff,1.5));

const light = new THREE.DirectionalLight(0xffffff,2);
light.position.set(5,10,5);
scene.add(light);

// loader
const loader = new GLTFLoader();

loader.load(
"/ar-ortopediabelen/kidbuu/kidbuu1.glb",

(gltf)=>{

  model = gltf.scene;
  scene.add(model);

  // buscar esfera dentro del modelo
  model.traverse((obj)=>{

    if(obj.isMesh){

      // 🔥 detecta esfera por nombre o tamaño
      if(obj.name.toLowerCase().includes("sphere") ||
         obj.name.toLowerCase().includes("planet")){

        energySphere = obj;

        // cambiar material a energía
        energySphere.material = new THREE.MeshBasicMaterial({
          color:0xff55ff,
          transparent:true,
          opacity:0.5,
          blending:THREE.AdditiveBlending
        });

        console.log("🔥 ESFERA ENCONTRADA:", obj.name);
      }
    }
  });

  // centrar modelo
  const box=new THREE.Box3().setFromObject(model);
  const center=box.getCenter(new THREE.Vector3());
  model.position.sub(center);

});

// animación
function animate(t){

  requestAnimationFrame(animate);

  if(model) model.rotation.y += 0.003;

  // energía viva SOLO en tu esfera
  if(energySphere){
    let s = 1 + Math.sin(t*0.002)*0.05;
    energySphere.scale.set(s,s,s);
  }

  controls.update();
  renderer.render(scene,camera);
}
animate();

</script>
</body>
</html>
