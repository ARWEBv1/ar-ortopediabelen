<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kid Buu Viewer</title>
<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
}
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.159/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.159/examples/js/loaders/GLTFLoader.js"></script>

<script>

// ESCENA
const scene = new THREE.Scene();

// CAMARA
const camera = new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.1,
1000
);
camera.position.z = 5;

// RENDER
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

// LUZ SIMPLE
scene.add(new THREE.AmbientLight(0xffffff,2));

// CARGAR GLB
const loader = new THREE.GLTFLoader();

loader.load(
"/ar-ortopediabelen/kidbuu/kidbuu1.glb",

(gltf)=>{
    const model = gltf.scene;
    scene.add(model);
    console.log("GLB CARGADO ✅");
},

undefined,

(error)=>{
    console.error("ERROR:", error);
}
);

// ANIMACION
function animate(){
  requestAnimationFrame(animate);
  renderer.render(scene,camera);
}
animate();

// RESIZE
window.addEventListener("resize",()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
