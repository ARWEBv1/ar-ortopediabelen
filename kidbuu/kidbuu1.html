<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KidBuu</title>
<style>
body{margin:0;overflow:hidden;}
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.159/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.159/examples/js/loaders/GLTFLoader.js"></script>

<script>

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000015);

const camera = new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

// luz
const light = new THREE.PointLight(0xff66ff,3);
light.position.set(0,2,5);
scene.add(light);

const ambient = new THREE.AmbientLight(0xffffff,0.5);
scene.add(ambient);

// cargar GLB
const loader = new THREE.GLTFLoader();

loader.load("kidbuu.glb", function(gltf){
    scene.add(gltf.scene);
});

// esfera energía
const geo = new THREE.SphereGeometry(1.5,64,64);
const mat = new THREE.MeshBasicMaterial({
    color:0xff66ff,
    transparent:true,
    opacity:0.3
});
const sphere = new THREE.Mesh(geo,mat);
scene.add(sphere);

function animate(){
  requestAnimationFrame(animate);

  sphere.rotation.y += 0.01;

  renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
