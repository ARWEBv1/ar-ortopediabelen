<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kid Buu FIX</title>
<style>
body{margin:0;overflow:hidden;background:#000;}
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.159/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.159/examples/js/loaders/GLTFLoader.js"></script>

<script>

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

// luces
scene.add(new THREE.AmbientLight(0xffffff,1.5));

const light = new THREE.DirectionalLight(0xffffff,2);
light.position.set(5,10,5);
scene.add(light);

// loader
const loader = new THREE.GLTFLoader();

loader.load(
"/ar-ortopediabelen/kidbuu/kidbuu1.glb",

(gltf)=>{

  const model = gltf.scene;
  scene.add(model);

  // 🔥 CENTRAR MODELO AUTOMATICAMENTE
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());

  model.position.sub(center);

  // mover cámara según tamaño
  const maxDim = Math.max(size.x,size.y,size.z);
  camera.position.z = maxDim * 2.5;
  camera.position.y = maxDim * 0.5;

  console.log("KID BUU CARGADO 🔥");
},

undefined,

(error)=>{ console.error(error); }

);

function animate(){
 requestAnimationFrame(animate);
 renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>
</body>
</html>
