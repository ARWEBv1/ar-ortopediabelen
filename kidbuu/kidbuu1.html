<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Energy Sphere</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: radial-gradient(circle, #001a44, #000);
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

resize();
window.addEventListener("resize", resize);

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function lightning(x1,y1,x2,y2){
  ctx.beginPath();
  ctx.moveTo(x1,y1);

  let segments = 20;
  for(let i=1;i<segments;i++){
    let t = i/segments;
    let x = x1 + (x2-x1)*t + (Math.random()-0.5)*20;
    let y = y1 + (y2-y1)*t + (Math.random()-0.5)*20;
    ctx.lineTo(x,y);
  }

  ctx.lineTo(x2,y2);
  ctx.strokeStyle = "rgba(255,120,255,0.9)";
  ctx.lineWidth = 2;
  ctx.stroke();
}

function draw(t){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  let cx = canvas.width/2;
  let cy = canvas.height/2;
  let r = 120;

  // esfera glow
  let grad = ctx.createRadialGradient(cx,cy,20,cx,cy,r);
  grad.addColorStop(0,"#fff");
  grad.addColorStop(0.3,"#ff66ff");
  grad.addColorStop(1,"rgba(255,0,255,0)");

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fill();

  // rayos
  for(let i=0;i<8;i++){
    let angle = (Math.PI*2/8)*i + t*0.001;
    let x2 = cx + Math.cos(angle)*300;
    let y2 = cy + Math.sin(angle)*300;
    lightning(cx,cy,x2,y2);
  }

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
