<!DOCTYPE html>
<html>
<body style="margin:0;overflow:hidden;background:black">

<script src="https://cdn.jsdelivr.net/npm/three@0.159/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.159/examples/js/loaders/GLTFLoader.js"></script>

<script>

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.001,100000);
camera.position.set(0,0,5);

const renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// luz
scene.add(new THREE.AmbientLight(0xffffff,5));

// 🔥 CUBO DE PRUEBA (debe verse SIEMPRE)
const cube = new THREE.Mesh(
  new THREE.BoxGeometry(1,1,1),
  new THREE.MeshBasicMaterial({color:0x00ff00})
);
scene.add(cube);

// cargar GLB
const loader = new THREE.GLTFLoader();

loader.load(
"/ar-ortopediabelen/kidbuu/kidbuu1.glb",

(gltf)=>{

  const model = gltf.scene;

  // FORZAR MATERIAL VISUAL
  model.traverse(obj=>{
    if(obj.isMesh){
      obj.material = new THREE.MeshNormalMaterial();
    }
  });

  scene.add(model);

  console.log("GLB SI CARGA 🔥", model);
},

undefined,

(e)=>console.error(e)

);

function animate(){
 requestAnimationFrame(animate);

 cube.rotation.x += 0.01;
 cube.rotation.y += 0.01;

 renderer.render(scene,camera);
}
animate();

</script>

</body>
</html>
