<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kid Buu GOD MODE</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
}

/* energía encima */
#energy{
  position:absolute;
  top:0;
  left:0;
  pointer-events:none;
}
</style>
</head>
<body>

<canvas id="energy"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

let model;

// ---------------------
// THREE JS (KID BUU)
// ---------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(
60,
innerWidth/innerHeight,
0.01,
1000
);

camera.position.set(0,1,4);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

document.body.appendChild(renderer.domElement);

// controles
const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;

// luces
scene.add(new THREE.AmbientLight(0xffffff,1.5));

const light1 = new THREE.DirectionalLight(0xffffff,2);
light1.position.set(5,10,5);
scene.add(light1);

const light2 = new THREE.DirectionalLight(0xffffff,1);
light2.position.set(-5,5,-5);
scene.add(light2);

// cargar modelo
const loader = new GLTFLoader();

loader.load(
"/ar-ortopediabelen/kidbuu/kidbuu1.glb",

(gltf)=>{

  model = gltf.scene;
  scene.add(model);

  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());

  model.position.sub(center);

  const maxDim = Math.max(size.x,size.y,size.z);

  camera.position.set(0,maxDim*0.3,maxDim*2);
  controls.target.set(0,0,0);
  controls.update();
}
);

// ---------------------
// ENERGIA CANVAS (TU FAVORITA)
// ---------------------
const canvas = document.getElementById("energy");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize",resize);

function lightning(x1,y1,x2,y2,intensity=30){

  ctx.beginPath();
  ctx.moveTo(x1,y1);

  let seg=25;
  for(let i=1;i<seg;i++){
    let t=i/seg;
    let x=x1+(x2-x1)*t+(Math.random()-0.5)*intensity;
    let y=y1+(y2-y1)*t+(Math.random()-0.5)*intensity;
    ctx.lineTo(x,y);
  }

  ctx.lineTo(x2,y2);
  ctx.strokeStyle="rgba(255,180,255,0.9)";
  ctx.lineWidth=2;
  ctx.shadowBlur=30;
  ctx.shadowColor="#ff66ff";
  ctx.stroke();
}

// ---------------------
// LOOP
// ---------------------
function animate(t){

  requestAnimationFrame(animate);

  // modelo gira suavemente
  if(model){
    model.rotation.y += 0.003;
  }

  controls.update();
  renderer.render(scene,camera);

  // ----- ENERGIA -----
  ctx.clearRect(0,0,canvas.width,canvas.height);

  let cx=canvas.width/2;
  let cy=canvas.height/2;
  let r=140;

  let pulse=Math.sin(t*0.003)*15;

  let glow=ctx.createRadialGradient(cx,cy,20,cx,cy,r+80+pulse);
  glow.addColorStop(0,"rgba(255,255,255,0.9)");
  glow.addColorStop(0.3,"rgba(255,80,255,0.8)");
  glow.addColorStop(1,"rgba(255,0,255,0)");

  ctx.fillStyle=glow;
  ctx.beginPath();
  ctx.arc(cx,cy,r+80+pulse,0,Math.PI*2);
  ctx.fill();

  for(let i=0;i<12;i++){
    let ang=(Math.PI*2/12)*i+t*0.0015;
    let dist=300+Math.sin(t*0.004+i)*80;
    let x2=cx+Math.cos(ang)*dist;
    let y2=cy+Math.sin(ang)*dist;
    lightning(cx,cy,x2,y2,40);
  }

}

requestAnimationFrame(animate);

</script>
</body>
</html>
