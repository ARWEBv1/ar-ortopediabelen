<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kid Buu Animated</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
}
</style>
</head>
<body>

<!-- IMPORT MAP -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

// ---------------------
// VARIABLES
// ---------------------
let mixer;
const clock = new THREE.Clock();

// ---------------------
// ESCENA
// ---------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

// ---------------------
// CAMARA
// ---------------------
const camera = new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.01,
10000
);

// ---------------------
// RENDER
// ---------------------
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

// ---------------------
// LUCES
// ---------------------
scene.add(new THREE.AmbientLight(0xffffff,2));

const light = new THREE.DirectionalLight(0xffffff,3);
light.position.set(5,10,5);
scene.add(light);

// ---------------------
// CARGAR GLB
// ---------------------
const loader = new GLTFLoader();

loader.load(

"/ar-ortopediabelen/kidbuu/kidbuu1.glb",

(gltf)=>{

  const model = gltf.scene;
  scene.add(model);

  // CENTRAR MODELO
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());

  model.position.sub(center);

  // AUTO CAMARA
  const maxDim = Math.max(size.x,size.y,size.z);

  camera.position.set(0,maxDim*0.2,maxDim*2);
  camera.lookAt(0,0,0);

  // 🔥 ACTIVAR ANIMACIONES DEL GLB
  if(gltf.animations.length > 0){
    mixer = new THREE.AnimationMixer(model);
    const action = mixer.clipAction(gltf.animations[0]);
    action.play();

    console.log("🔥 ANIMACION ACTIVADA");
  }else{
    console.log("⚠️ EL GLB NO TIENE ANIMACIONES");
  }

},

undefined,

(error)=>{
  console.error(error);
}

);

// ---------------------
// SCREENSHOT (P)
// ---------------------
window.addEventListener("keydown",(e)=>{
  if(e.key==="p"){
    const link=document.createElement("a");
    link.download="kidbuu.png";
    link.href=renderer.domElement.toDataURL();
    link.click();
  }
});

// ---------------------
// ANIMACION LOOP
// ---------------------
function animate(){

  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  if(mixer) mixer.update(delta);

  renderer.render(scene,camera);
}

animate();

// ---------------------
// RESIZE
// ---------------------
window.addEventListener("resize",()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
