<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kid Buu SUBLIMACION MODE</title>
<style>
body{
 margin:0;
 overflow:hidden;
 background:radial-gradient(circle,#120018,#000);
}

#btn{
 position:fixed;
 top:20px;
 left:20px;
 padding:10px 18px;
 background:#ff0088;
 color:white;
 border:none;
 font-weight:bold;
 cursor:pointer;
 z-index:10;
 border-radius:6px;
}
</style>
</head>
<body>

<button id="btn">📸 CAPTURA</button>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
 }
}
</script>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const btn=document.getElementById("btn");

let paused=false;
let freezeTime=0;

btn.onclick=()=>{

 paused=!paused;

 if(paused){
   freezeTime=performance.now();
   btn.textContent="▶ CONTINUAR";
 }else{
   btn.textContent="📸 CAPTURA";
 }

};

let model;
let energySphere;
let modelHeight=2;

let orbs=[];
let lightning=[];
let spawnPos=new THREE.Vector3();

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050005);

// 🔥 CAMARA DESDE ABAJO
const camera=new THREE.PerspectiveCamera(
60,innerWidth/innerHeight,0.01,1000
);

camera.position.set(0,-1.2,5);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.target.set(0,1,0);

// luces
scene.add(new THREE.AmbientLight(0xffffff,1.8));

const light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(5,8,5);
scene.add(light);

// 🌸 aura rosada
const auraLight=new THREE.PointLight(0xff33aa,4,20);
auraLight.position.set(0,2,0);
scene.add(auraLight);

// ---------- LOAD MODEL ----------
const loader=new GLTFLoader();

loader.load(
"/ar-ortopediabelen/kidbuu/kidbuu1.glb",
(gltf)=>{

 model=gltf.scene;
 scene.add(model);

 model.traverse((obj)=>{

  if(obj.isMesh){

   if(
    obj.name.toLowerCase().includes("sphere") ||
    obj.name.toLowerCase().includes("planet")
   ){

    energySphere=obj;

    energySphere.material=new THREE.MeshBasicMaterial({
      color:0xff0088,
      transparent:true,
      opacity:0.6,
      blending:THREE.AdditiveBlending
    });
   }
  }
 });

 const box=new THREE.Box3().setFromObject(model);
 const center=box.getCenter(new THREE.Vector3());
 const size=box.getSize(new THREE.Vector3());

 modelHeight=size.y;
 model.position.sub(center);

 // aura visual extra
 const auraMesh=new THREE.Mesh(
  new THREE.SphereGeometry(3,32,32),
  new THREE.MeshBasicMaterial({
   color:0xff0099,
   transparent:true,
   opacity:0.15,
   blending:THREE.AdditiveBlending
  })
 );

 auraMesh.position.set(0,1,0);
 scene.add(auraMesh);

 // orbes
 const colors=[0xff0000,0x6600ff,0xffff00];

 for(let i=0;i<3;i++){

  const orb=new THREE.Mesh(
   new THREE.SphereGeometry(1,32,32),
   new THREE.MeshBasicMaterial({
    color:colors[i],
    transparent:true,
    opacity:0,
    blending:THREE.AdditiveBlending
   })
  );

  orb.userData.offset=i*0.5;
  scene.add(orb);
  orbs.push(orb);
 }

 // rayos
 for(let i=0;i<12;i++){

  const mat=new THREE.LineBasicMaterial({
   color:0xffffff,
   transparent:true,
   opacity:0.8
  });

  const geo=new THREE.BufferGeometry().setFromPoints([
   new THREE.Vector3(),
   new THREE.Vector3()
  ]);

  const line=new THREE.Line(geo,mat);
  scene.add(line);
  lightning.push(line);
 }

});

// ---------- SHAKE ----------
function sceneShake(intensity){

 scene.position.set(
  (Math.random()-0.5)*intensity,
  (Math.random()-0.5)*intensity,
  (Math.random()-0.5)*intensity
 );

}

// ---------- RAYOS ----------
function updateLightning(){

 if(!energySphere) return;

 lightning.forEach((line)=>{

  const start=spawnPos.clone();

  const dir=new THREE.Vector3(
   Math.random()-0.5,
   Math.random()-0.5,
   Math.random()-0.5
  ).normalize();

  const end=start.clone().add(dir.multiplyScalar(3));

  line.geometry.setFromPoints([start,end]);
  line.material.opacity=Math.random();
 });

}

// ---------- ANIMATE ----------
function animate(t){

 requestAnimationFrame(animate);

 // 📸 FREEZE FRAME
 if(paused){
  t=freezeTime;
 }

 if(energySphere){

  const s=1+Math.sin(t*0.004)*0.08;
  energySphere.scale.set(s,s,s);

  energySphere.getWorldPosition(spawnPos);

  spawnPos.y -= modelHeight*0.5;
  spawnPos.y += 3;
 }

 orbs.forEach((orb)=>{

  if(!energySphere) return;

  let time=(t*0.001+orb.userData.offset);
  let progress=time%1;

  orb.position.copy(spawnPos);

  const scale=0.4 + progress*9;
  orb.scale.set(scale,scale,scale);

  orb.material.opacity=1-progress;
 });

 updateLightning();

 sceneShake(0.07);

 controls.update();
 renderer.render(scene,camera);
}

animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
