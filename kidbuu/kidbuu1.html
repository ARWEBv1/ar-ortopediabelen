<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kid Buu Viewer FIX</title>
<style>
body{margin:0;overflow:hidden;background:black;}
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.159/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.159/examples/js/loaders/GLTFLoader.js"></script>

<script>

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.01,
10000
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

// luces fuertes
scene.add(new THREE.AmbientLight(0xffffff,2));

const dirLight = new THREE.DirectionalLight(0xffffff,3);
dirLight.position.set(5,10,5);
scene.add(dirLight);

// loader
const loader = new THREE.GLTFLoader();

loader.load(
"/ar-ortopediabelen/kidbuu/kidbuu1.glb",

(gltf)=>{

  const model = gltf.scene;
  scene.add(model);

  // 🔥 AUTO CENTER
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());

  model.position.sub(center);

  // 🔥 AUTO CAMERA
  const maxDim = Math.max(size.x,size.y,size.z);
  const fov = camera.fov * (Math.PI/180);
  let cameraZ = Math.abs(maxDim / Math.sin(fov/2));

  camera.position.set(0,maxDim*0.2,cameraZ*0.8);
  camera.lookAt(0,0,0);

  console.log("KID BUU ENCONTRADO 🔥");
},

undefined,

(err)=>console.error(err)

);

function animate(){
 requestAnimationFrame(animate);
 renderer.render(scene,camera);
}
animate();

</script>
</body>
</html>
