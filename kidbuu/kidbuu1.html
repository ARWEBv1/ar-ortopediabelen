<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kid Buu Energy REAL</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:#111;
}
</style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

let model;

// ---------------------
// ESCENA
// ---------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

// ---------------------
// CAMARA
// ---------------------
const camera = new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.01,
1000
);

camera.position.set(0,1,4);

// ---------------------
// RENDER
// ---------------------
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

document.body.appendChild(renderer.domElement);

// ---------------------
// CONTROLES
// ---------------------
const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;

// ---------------------
// LUCES
// ---------------------
scene.add(new THREE.AmbientLight(0xffffff,1.5));

const keyLight = new THREE.DirectionalLight(0xffffff,2);
keyLight.position.set(5,10,5);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xffffff,1);
fillLight.position.set(-5,5,-5);
scene.add(fillLight);

// ---------------------
// CARGAR KID BUU
// ---------------------
const loader = new GLTFLoader();

loader.load(
"/ar-ortopediabelen/kidbuu/kidbuu1.glb",

(gltf)=>{

  model = gltf.scene;
  scene.add(model);

  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());

  model.position.sub(center);

  const maxDim = Math.max(size.x,size.y,size.z);

  camera.position.set(0,maxDim*0.3,maxDim*2);
  controls.target.set(0,0,0);
  controls.update();
}
);

// ---------------------
// ESFERA ENERGIA REAL
// ---------------------

const sphereGeo = new THREE.SphereGeometry(1.8,64,64);

const sphereMat = new THREE.MeshBasicMaterial({
  color:0xff55ff,
  transparent:true,
  opacity:0.35,
  blending:THREE.AdditiveBlending
});

const energySphere = new THREE.Mesh(sphereGeo,sphereMat);
scene.add(energySphere);

// ---------------------
// ANIMACION
// ---------------------
function animate(t){

  requestAnimationFrame(animate);

  // rotación Kid Buu
  if(model){
    model.rotation.y += 0.003;
  }

  // energía viva
  const s = 1 + Math.sin(t*0.002)*0.05;
  energySphere.scale.set(s,s,s);

  energySphere.rotation.y += 0.01;
  energySphere.rotation.x += 0.005;

  controls.update();
  renderer.render(scene,camera);
}

animate();

// ---------------------
// RESIZE
// ---------------------
window.addEventListener("resize",()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
