<!DOCTYPE html>
<html>
<body style="margin:0">

<script src="https://cdn.jsdelivr.net/npm/three@0.159/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.159/examples/js/loaders/GLTFLoader.js"></script>

<script>
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,2));

const loader = new THREE.GLTFLoader();

loader.load(
"/ar-ortopediabelen/kidbuu/kidbuu1.glb",
(gltf)=>{
    scene.add(gltf.scene);
    console.log("GLB CARGADO 🔥");
},
undefined,
(e)=>console.error(e)
);

function animate(){
 requestAnimationFrame(animate);
 renderer.render(scene,camera);
}
animate();
</script>

</body>
</html>
