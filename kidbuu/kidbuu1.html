<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kid Buu Energy FINAL +3</title>
<style>
body{
  margin:0;
  overflow:hidden;
  background:#111;
}
</style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three":"https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

let model;
let energySphere;

let modelHeight = 2;

let orbs = [];
let currentOrb = 0;
let orbStartTime = 0;
const orbDuration = 2200;

let spawnPos = new THREE.Vector3();

// ---------- ESCENA ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(
60,
innerWidth/innerHeight,
0.01,
1000
);

camera.position.set(0,1,4);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;

// luces
scene.add(new THREE.AmbientLight(0xffffff,1.5));

const light = new THREE.DirectionalLight(0xffffff,2);
light.position.set(5,10,5);
scene.add(light);

// ---------- CARGAR GLB ----------
const loader = new GLTFLoader();

loader.load(
"/ar-ortopediabelen/kidbuu/kidbuu1.glb",

(gltf)=>{

 model = gltf.scene;
 scene.add(model);

 model.traverse((obj)=>{

   if(obj.isMesh){

     if(
      obj.name.toLowerCase().includes("sphere") ||
      obj.name.toLowerCase().includes("planet")
     ){

       energySphere = obj;

       // energia interna
       energySphere.material = new THREE.MeshBasicMaterial({
         color:0xff55ff,
         transparent:true,
         opacity:0.5,
         blending:THREE.AdditiveBlending
       });
     }
   }
 });

 // centrar modelo
 const box = new THREE.Box3().setFromObject(model);
 const center = box.getCenter(new THREE.Vector3());
 const size = box.getSize(new THREE.Vector3());

 modelHeight = size.y;
 model.position.sub(center);

 const maxDim=Math.max(size.x,size.y,size.z);

 camera.position.set(0,maxDim*0.3,maxDim*2);
 controls.target.set(0,0,0);
 controls.update();

 // ---------- ORBES ----------
 const colors=[0x00ffff,0xff0000,0x00ff66];

 for(let i=0;i<3;i++){

   const orb=new THREE.Mesh(
     new THREE.SphereGeometry(1,32,32),
     new THREE.MeshBasicMaterial({
       color:colors[i],
       transparent:true,
       opacity:0,
       blending:THREE.AdditiveBlending
     })
   );

   orb.visible=false;
   scene.add(orb);

   orbs.push(orb);
 }

});

// ---------- ANIMATE ----------
function animate(t){

 requestAnimationFrame(animate);

 if(model) model.rotation.y += 0.003;

 // esfera principal viva
 if(energySphere){
   const s = 1 + Math.sin(t*0.002)*0.05;
   energySphere.scale.set(s,s,s);
 }

 // -------- ORBES --------
 if(orbs.length && energySphere){

   if(orbStartTime===0){

     orbStartTime=t;

     // posición fija
     energySphere.getWorldPosition(spawnPos);

     spawnPos.y -= modelHeight*0.5;

     // 🔥 AJUSTE FINAL
     spawnPos.y += 3;
   }

   const progress=(t-orbStartTime)/orbDuration;
   const orb=orbs[currentOrb];

   orb.visible=true;
   orb.position.copy(spawnPos);

   const scale=0.2 + progress*6;
   orb.scale.set(scale,scale,scale);

   orb.material.opacity=1-progress;

   if(progress>=1){

     orb.visible=false;

     currentOrb=(currentOrb+1)%orbs.length;
     orbStartTime=0;
   }
 }

 controls.update();
 renderer.render(scene,camera);
}

animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
