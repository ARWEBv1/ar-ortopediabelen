<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GLB Energy</title>
<style>
body { margin:0; overflow:hidden; }
</style>
</head>
<body>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.159/build/three.module.js";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.159/examples/jsm/loaders/GLTFLoader.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000015);

const camera = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// luz
const light = new THREE.PointLight(0xff66ff,5);
light.position.set(0,0,5);
scene.add(light);

// cargar GLB
const loader = new GLTFLoader();

loader.load("modelo.glb",(gltf)=>{
  scene.add(gltf.scene);
});

// esfera energía
const geo = new THREE.SphereGeometry(1.5,64,64);
const mat = new THREE.MeshBasicMaterial({
  color:0xff66ff,
  transparent:true,
  opacity:0.35
});

const sphere = new THREE.Mesh(geo,mat);
scene.add(sphere);

// animación
function animate(t){
  requestAnimationFrame(animate);

  sphere.rotation.y += 0.01;
  sphere.scale.setScalar(1 + Math.sin(t*0.002)*0.05);

  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
