<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kid Buu PRO</title>
<style>
body{margin:0;overflow:hidden;background:#111;}
</style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

let model;

// escena
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

// cámara
const camera = new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.01,
1000
);

camera.position.set(0,1,4);

// render PRO
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);

// ✨ hace que se vea mejor
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

document.body.appendChild(renderer.domElement);

// controles mouse
const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;

// luces tipo studio (como modelviewer)
scene.add(new THREE.AmbientLight(0xffffff,1.5));

const keyLight = new THREE.DirectionalLight(0xffffff,2);
keyLight.position.set(5,10,5);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xffffff,1);
fillLight.position.set(-5,5,-5);
scene.add(fillLight);

// cargar GLB
const loader = new GLTFLoader();

loader.load(
"/ar-ortopediabelen/kidbuu/kidbuu1.glb",

(gltf)=>{

  model = gltf.scene;
  scene.add(model);

  // centrar automático
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());

  model.position.sub(center);

  const maxDim = Math.max(size.x,size.y,size.z);

  camera.position.set(0,maxDim*0.3,maxDim*2);

  controls.target.set(0,0,0);
  controls.update();

  console.log("🔥 MODELO CARGADO BONITO");
}

);

// animación
function animate(){

  requestAnimationFrame(animate);

  // rotación suave automática
  if(model){
    model.rotation.y += 0.003;
  }

  controls.update();
  renderer.render(scene,camera);
}
animate();

// resize
window.addEventListener("resize",()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
