<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ortopediasbelen - Sublimados</title>
<style>
:root{--ink:#172326;--muted:#617174;--line:#d9e0df;--paper:#f7faf9;--green:#0f7c6d;--coral:#d8563b}
body{margin:0;font-family:Arial;background:var(--paper)}
.auth{display:grid;place-items:center;height:100vh}
.auth-card{background:#fff;padding:20px;border:1px solid var(--line)}
.tab{padding:10px;border:1px solid var(--line);cursor:pointer}
.tab.active{background:var(--green);color:#fff}
.panel{display:none}
.panel.active{display:block}
.btn{padding:10px;background:var(--green);color:#fff;border:none;cursor:pointer}
.msg{color:red}
.app{display:none}
body.unlocked .auth{display:none}
body.unlocked .app{display:block}
</style>
</head>

<body class="locked">

<section class="auth">
<div class="auth-card">

<div>
<button class="tab active" data-panel="clientPanel">Cliente</button>
<button class="tab" data-panel="adminPanel">Admin</button>
</div>

<div id="clientPanel" class="panel active">
<form id="clientLogin">
<input id="clientPass" type="password" placeholder="Clave cliente">
<button class="btn">Entrar</button>
<div id="clientMsg" class="msg"></div>
</form>
</div>

<div id="adminPanel" class="panel">
<form id="adminLogin">
<input id="adminPass" type="password" placeholder="Clave admin">
<button class="btn">Entrar</button>
<div id="adminMsg" class="msg"></div>
</form>
</div>

</div>
</section>

<div class="app">
<h1>SISTEMA OK 🔥</h1>

<form id="changePass">
<input id="adminConfirm" type="password" placeholder="Admin">
<input id="newClientPass" type="password" placeholder="Nueva cliente">
<button class="btn">Guardar</button>
<div id="changeMsg"></div>
</form>

<button id="logout">Salir</button>

</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

let ADMIN_CODE;

(async () => {
  ADMIN_CODE = await hash("2212");
})();
const CLIENT_KEY="clientePass";
const SESSION_KEY="session";

const $=id=>document.getElementById(id);

const els={
clientLogin:$("clientLogin"),
adminLogin:$("adminLogin"),
clientPass:$("clientPass"),
adminPass:$("adminPass"),
clientMsg:$("clientMsg"),
adminMsg:$("adminMsg"),
changePass:$("changePass"),
adminConfirm:$("adminConfirm"),
newClientPass:$("newClientPass"),
changeMsg:$("changeMsg"),
logout:$("logout")
};

async function hash(v){
let h=2166136261;
for(let i=0;i<v.length;i++){
h^=v.charCodeAt(i);
h=Math.imul(h,16777619);
}
return (h>>>0).toString(16);
}

function setAccess(mode){
document.body.classList.toggle("unlocked",mode==="admin"||mode==="client");
}

document.querySelectorAll(".tab").forEach(b=>{
b.onclick=()=>{
document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
b.classList.add("active");
$(b.dataset.panel).classList.add("active");
};
});

els.clientLogin.addEventListener("submit",async e=>{
e.preventDefault();
const saved=localStorage.getItem(CLIENT_KEY);
if(!saved){els.clientMsg.textContent="No hay clave cliente";return;}
if(await hash(els.clientPass.value)!==saved){els.clientMsg.textContent="Clave mala";return;}
sessionStorage.setItem(SESSION_KEY,"client");
setAccess("client");
});

els.adminLogin.addEventListener("submit",async e=>{
e.preventDefault();
if(await hash(els.adminPass.value)!==ADMIN_CODE){els.adminMsg.textContent="Admin mal";return;}
sessionStorage.setItem(SESSION_KEY,"admin");
setAccess("admin");
});

els.changePass.addEventListener("submit",async e=>{
e.preventDefault();
if(await hash(els.adminConfirm.value)!==ADMIN_CODE){els.changeMsg.textContent="Admin incorrecto";return;}
localStorage.setItem(CLIENT_KEY,await hash(els.newClientPass.value));
els.changeMsg.textContent="Guardado 🔥";
});

els.logout.onclick=()=>{
sessionStorage.clear();
setAccess("");
};

setAccess(sessionStorage.getItem(SESSION_KEY));

});
</script>

</body>
</html>
