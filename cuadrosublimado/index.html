<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ortopediasbelen - Sublimados</title>

<style>
:root {
  --ink: #172326;
  --muted: #617174;
  --line: #d9e0df;
  --paper: #f7faf9;
  --green: #0f7c6d;
  --coral: #d8563b;
  --shadow: 0 18px 48px rgba(23, 35, 38, .18);
}

* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--ink); }

.stage {
  min-height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr;
  background: linear-gradient(135deg, #4b0082, #7b2cbf, #9d4edd);
}

/* RESTO IGUAL */
.frame {
  width: var(--fw, 220px);
  height: var(--fh, 300px);
  border: 8px solid #172326;
  background: #fff;
  box-shadow: inset 0 0 0 5px #fff;
}

/* RESPONSIVE MÁS GRANDE */
@media (max-width: 520px) {
  .frame { width: 160px; height: 220px; }
}
</style>
</head>

<body>

<input type="file" id="upload">

<button id="sendBtn">Enviar</button>

<div class="frame">
  <div class="art" id="art"></div>
</div>

<form id="orderForm"
action="https://formsubmit.co/admin@ortopediasbelen.com"
method="POST"
enctype="multipart/form-data">

<input type="file" id="realFile" name="attachment">

<input type="hidden" name="_subject" id="orderSubject">
<input type="hidden" name="pedido" id="orderMessage">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_template" value="table">

</form>

<script>
const upload = document.getElementById("upload");
const realFile = document.getElementById("realFile");
const art = document.getElementById("art");

upload.addEventListener("change", () => {
  const file = upload.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    art.style.background = `url(${reader.result}) center/cover`;
  };
  reader.readAsDataURL(file);

  const dt = new DataTransfer();
  dt.items.add(file);
  realFile.files = dt.files;
});

document.getElementById("sendBtn").addEventListener("click", () => {
  document.getElementById("orderSubject").value = "Pedido nuevo";
  document.getElementById("orderMessage").value = "Pedido con imagen";

  document.getElementById("orderForm").requestSubmit();
});
</script>

</body>
</html>
