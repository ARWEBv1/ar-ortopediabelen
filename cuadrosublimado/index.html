<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ortopediasbelen - Sublimados</title>
</head>

<body class="locked">

<h2>Si ves esto, el HTML carga</h2>

<form id="adminLogin">
<input id="adminPass" type="password">
<button>Entrar</button>
</form>

<div id="adminMsg"></div>

<script>
document.addEventListener("DOMContentLoaded", () => {

const ADMIN_CODE = "a9461750";

const adminLogin = document.getElementById("adminLogin");
const adminPass = document.getElementById("adminPass");
const adminMsg = document.getElementById("adminMsg");

adminLogin.addEventListener("submit", async (e) => {
  e.preventDefault();

  const hash = async (value)=>{
    let h=2166136261;
    const s=`ortopediasbelen:${value}`;
    for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
    return (h>>>0).toString(16).padStart(8,"0");
  };

  if(await hash(adminPass.value)!==ADMIN_CODE){
    adminMsg.textContent="admin mal";
    return;
  }

  document.body.classList.add("unlocked");
  adminMsg.textContent="ENTRASTE 🔥";

});

});
</script>

</body>
</html>
