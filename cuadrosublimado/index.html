<script>
const firebaseConfig = {

  databaseURL: "https://ortopediasbelen-sublima-default-rtdb.firebaseio.com",
  projectId: "ortopediasbelen-sublima"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

async function saveClientPassword(hash) {
  await db.ref("config/clientPassword").set(hash);
}

async function getClientPassword() {
  const snapshot = await db.ref("config/clientPassword").once("value");
  return snapshot.val();
}
</script>

<script>
/* 👇 TODO TU JS ORIGINAL PERO MODIFICADO SOLO EN 3 PARTES */

const ADMIN_CODE = "a9461750";
const CLIENT_KEY = "ortopediasbelenClientPasswordHash";
const SESSION_KEY = "ortopediasbelenSessionMode";

/* 🔐 HASH igual */
async function hash(value) {
  let h = 2166136261;
  const s = `ortopediasbelen:${value}`;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(16).padStart(8, "0");
}

/* 🔥 LOGIN CLIENTE (CAMBIADO) */
els.clientLogin.addEventListener("submit", async (e) => {
  e.preventDefault();

  const savedPass = await getClientPassword();

  if (!savedPass) {
    els.clientMsg.textContent = "El administrador aún no ha creado la contraseña cliente.";
    return;
  }

  if (await hash(els.clientPass.value) !== savedPass) {
    els.clientMsg.textContent = "Contraseña cliente incorrecta.";
    return;
  }

  sessionStorage.setItem(SESSION_KEY, "client");
  setAccess("client");
});

/* 🔥 CAMBIAR CLAVE (CAMBIADO) */
els.changePass.addEventListener("submit", async (e) => {
  e.preventDefault();

  if (await hash(els.adminConfirm.value) !== ADMIN_CODE) {
    els.changeMsg.textContent = "La contraseña admin no coincide.";
    return;
  }

  if (!els.newClientPass.value.trim()) {
    els.changeMsg.textContent = "Escribe una clave cliente.";
    return;
  }

  await saveClientPassword(await hash(els.newClientPass.value));

  els.adminConfirm.value = "";
  els.newClientPass.value = "";
  els.changeMsg.textContent = "Clave cliente actualizada 🔥";
});

/* 🔥 QR FIJO (CAMBIADO) */
function updateQr() {
  const base = `${location.origin}${location.pathname}`;
  els.qr.src = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(base)}`;
  els.qrLink.textContent = base;
}
