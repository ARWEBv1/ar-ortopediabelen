<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ortopediasbelen - Sublimados</title>

<style>
body { font-family: Arial; margin:0; }
.auth { display:flex; justify-content:center; align-items:center; height:100vh; }
.panel { display:none; }
.panel.active { display:block; }
.tab.active { background:green; color:#fff; }
</style>

</head>

<body>

<div class="auth">
  <div>
    <button class="tab active" onclick="show('client')">Cliente</button>
    <button class="tab" onclick="show('admin')">Admin</button>

    <div id="client" class="panel active">
      <form id="clientLogin">
        <input id="clientPass" type="password">
        <button>Entrar</button>
        <div id="clientMsg"></div>
      </form>
    </div>

    <div id="admin" class="panel">
      <form id="adminLogin">
        <input id="adminPass" type="password">
        <button>Entrar</button>
        <div id="adminMsg"></div>
      </form>
    </div>
  </div>
</div>

<script>
function show(x){
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  document.getElementById(x).classList.add("active");
}
</script>

<!-- 🔥 FIREBASE SOLO UNA VEZ -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB6zRDBsxWqrP4ART6fFvHK4_ccOBBVkLg",
  authDomain: "ortopediasbelen-sublima.firebaseapp.com",
  databaseURL: "https://ortopediasbelen-sublima-default-rtdb.firebaseio.com",
  projectId: "ortopediasbelen-sublima"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function hash(str){
  let h=2166136261;
  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}
  return (h>>>0).toString(16);
}

const ADMIN_CODE="a9461750";

/* LOGIN CLIENTE */
clientLogin.onsubmit=async(e)=>{
  e.preventDefault();
  const pass=clientPass.value;

  const snap=await db.ref("config/clientPassword").once("value");
  const real=snap.val();

  if(!real){clientMsg.innerText="No hay clave";return;}
  if(hash(pass)!==real){clientMsg.innerText="Incorrecta";return;}

  alert("Cliente OK 🔥");
};

/* LOGIN ADMIN */
adminLogin.onsubmit=(e)=>{
  e.preventDefault();
  if(hash(adminPass.value)!==ADMIN_CODE){adminMsg.innerText="Admin mal";return;}
  alert("Admin OK 🔥");
};
</script>

</body>
</html>
