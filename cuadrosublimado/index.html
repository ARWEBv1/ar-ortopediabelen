<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ortopediasbelen - Sublimados</title>
  <style>
    :root {
      --ink: #1d2528;
      --muted: #617074;
      --line: #d9e0df;
      --paper: #f7faf9;
      --panel: #ffffff;
      --green: #0f7c6d;
      --green-dark: #09594f;
      --coral: #d8563b;
      --yellow: #e2ad2f;
      --wall: #e8eeee;
      --floor: #b9a68a;
      --shadow: 0 16px 45px rgba(29, 37, 40, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      background: var(--paper);
    }

    body:not(.unlocked) .app {
      display: none;
    }

    body.unlocked .auth-screen {
      display: none;
    }

    body.client-mode .admin-only {
      display: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
    }

    .auth-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(247, 250, 249, 0.96)),
        linear-gradient(135deg, #dfe9e8, #f7faf9 44%, #d9e0df);
    }

    .auth-panel {
      width: min(440px, 100%);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .auth-panel h1 {
      margin-bottom: 6px;
    }

    .auth-form {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 18px;
    }

    .auth-tab {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fff;
      cursor: pointer;
