<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ortopediasbelen - Sublimados</title>

<style>
:root {
  --ink: #172326;
  --muted: #617174;
  --line: #d9e0df;
  --paper: #f7faf9;
  --green: #0f7c6d;
  --coral: #d8563b;
  --shadow: 0 18px 48px rgba(23, 35, 38, .18);
}

* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--ink); background: var(--paper); }

/* 🔥 FONDO MORADO */
.stage {
  min-height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr;
  background: linear-gradient(135deg, #4b0082, #7b2cbf, #9d4edd);
}

/* TODO LO DEMÁS IGUAL */
.frame {
  width: var(--fw, 180px);
  height: var(--fh, 240px);
  border: 8px solid #172326;
  background: #fff;
  box-shadow: inset 0 0 0 5px #fff;
}

.art { width: 100%; height: 100%; background: var(--art) center/cover no-repeat; }

</style>
</head>

<body>

<input id="upload" type="file">
<button id="sendBtn">Enviar pedido</button>

<div class="frame">
  <div class="art" id="art"></div>
</div>

<!-- 🔥 FORM REAL -->
<form id="orderForm"
action="https://formsubmit.co/admin@ortopediasbelen.com"
method="POST"
enctype="multipart/form-data">

  <!-- 🔥 INPUT REAL OCULTO -->
  <input type="file" id="realFile" name="attachment" style="display:none;">

  <input type="hidden" name="_subject" id="orderSubject">
  <input type="hidden" name="pedido" id="orderMessage">
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_template" value="table">
</form>

<script>
const upload = document.getElementById("upload");
const realFile = document.getElementById("realFile");
const art = document.getElementById("art");

upload.addEventListener("change", () => {
  const file = upload.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    art.style.backgroundImage = `url(${reader.result})`;
  };
  reader.readAsDataURL(file);

  // 🔥 CLAVE: pasar archivo al form real
  const dt = new DataTransfer();
  dt.items.add(file);
  realFile.files = dt.files;
});

document.getElementById("sendBtn").addEventListener("click", () => {

  if (!upload.files.length) {
    alert("Sube una imagen primero");
    return;
  }

  document.getElementById("orderSubject").value = "Pedido nuevo";
  document.getElementById("orderMessage").value = "Pedido con imagen adjunta";

  // 🔥 ENVÍO CORRECTO
  document.getElementById("orderForm").requestSubmit();
});
</script>

</body>
</html>
