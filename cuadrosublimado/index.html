<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ortopediasbelen - Sublimados</title>

<style>
:root {
  --ink: #172326;
  --muted: #617174;
  --line: #d9e0df;
  --paper: #f7faf9;
  --green: #0f7c6d;
  --coral: #d8563b;
}

body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #4b0082, #7b2cbf, #9d4edd);
  color: white;
}

.app {
  display: grid;
  grid-template-columns: 350px 1fr;
}

/* PANEL IZQUIERDO */
.controls {
  background: #111;
  padding: 20px;
}

button {
  padding: 10px;
  margin: 5px;
  cursor: pointer;
}

/* GALERIA */
.room {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* CUADROS MÁS GRANDES */
.frame {
  width: var(--fw, 260px);
  height: var(--fh, 340px);
  border: 10px solid white;
  background: white;
}

.art {
  width: 100%;
  height: 100%;
  background-size: cover;
}

/* RESPONSIVE */
@media (max-width: 520px) {
  .frame {
    width: 180px;
    height: 240px;
  }
}
</style>
</head>

<body>

<main class="app">

<!-- PANEL -->
<aside class="controls">
  <h2>Simulador</h2>

  <input type="file" id="upload" name="attachment" accept="image/*">

  <br><br>

  <button id="sendBtn">Enviar pedido</button>

  <p id="msg"></p>
</aside>

<!-- PREVIEW -->
<section class="room">
  <div class="frame">
    <div class="art" id="art"></div>
  </div>
</section>

</main>

<!-- FORM REAL (IMPORTANTE) -->
<form id="orderForm"
action="https://formsubmit.co/admin@ortopediasbelen.com"
method="POST"
enctype="multipart/form-data">

  <input type="file" id="realFile" name="attachment">

  <input type="hidden" name="_subject" id="subject">
  <input type="hidden" name="pedido" id="pedido">
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_template" value="table">

</form>

<script>
const upload = document.getElementById("upload");
const realFile = document.getElementById("realFile");
const art = document.getElementById("art");
const btn = document.getElementById("sendBtn");
const msg = document.getElementById("msg");

let fileData = null;

// PREVIEW
upload.addEventListener("change", () => {
  const file = upload.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    art.style.backgroundImage = `url('${reader.result}')`;
  };
  reader.readAsDataURL(file);

  fileData = file;

  // CLONAR archivo al form real
  const dt = new DataTransfer();
  dt.items.add(file);
  realFile.files = dt.files;
});

// ENVIAR
btn.addEventListener("click", () => {

  if (!fileData) {
    msg.textContent = "Sube una imagen primero";
    return;
  }

  document.getElementById("subject").value = "Nuevo pedido";
  document.getElementById("pedido").value = "Pedido con imagen adjunta";

  // ENVÍO REAL
  document.getElementById("orderForm").requestSubmit();
});
</script>

</body>
</html>
