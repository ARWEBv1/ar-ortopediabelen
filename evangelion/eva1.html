<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>AT Field Vibrante</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
body{
  margin:0;
  background:black;
  overflow:hidden;
}

model-viewer{
  width:100vw;
  height:100vh;
}
</style>
</head>

<body>

<model-viewer
  id="scene"
  src="evangelion1.glb?v=7"
  camera-controls
  exposure="1"
  shadow-intensity="1"
  environment-image="neutral"
>
</model-viewer>

<script>
const viewer = document.getElementById("scene");

viewer.addEventListener("load", () => {

  const materials = viewer.model.materials;

  materials.forEach((mat) => {

    const pbr = mat.pbrMetallicRoughness;

    // Base sólido suave
    pbr.setBaseColorFactor([1.0, 0.6, 0.8, 1.0]);
    pbr.setRoughnessFactor(0.6);
    pbr.setMetallicFactor(0.0);

    // 🔥 Emisión RGB tipo tubo
    mat.emissiveFactor = [1.0, 0.2, 0.8];
  });

  // 🎬 Animación RGB + vibración
  let t = 0;

  function animate(){
    t += 0.05;

    const r = (Math.sin(t) + 1) / 2;
    const g = (Math.sin(t + 2) + 1) / 2;
    const b = (Math.sin(t + 4) + 1) / 2;

    materials.forEach((mat) => {
      mat.emissiveFactor = [r, g, b];
    });

    // Vibración pequeña tipo forcejeo
    const scale = 1 + Math.sin(t * 5) * 0.01;
    viewer.scale = `${scale} ${scale} ${scale}`;

    requestAnimationFrame(animate);
  }

  animate();

});
</script>

</body>
</html>
