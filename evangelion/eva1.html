<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Evangelion AT Field</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
body{
  margin:0;
  background:black;
  overflow:hidden;
}

model-viewer{
  width:100vw;
  height:100vh;
}
</style>
</head>

<body>

<model-viewer
  id="scene"
  src="evangelion1.glb?v=3"
  camera-controls
  auto-rotate
  exposure="1"
  shadow-intensity="1"
  environment-image="neutral"
>
</model-viewer>

<script>
const viewer = document.getElementById("scene");

viewer.addEventListener("load", () => {

  // 🔎 Buscamos el nodo que contenga "redondo"
  let shieldNode = null;

  viewer.model.scene.traverse((node) => {
    if(node.name.toLowerCase().includes("redondo")){
      shieldNode = node;
    }
  });

  if(!shieldNode){
    console.log("No se encontró el escudo.");
    return;
  }

  let t = 0;

  function vibrar(){
    t += 0.1;

    const scaleX = 1 + Math.sin(t * 6) * 0.015;
    const scaleY = 1 + Math.sin(t * 5) * 0.012;
    const scaleZ = 1 + Math.sin(t * 7) * 0.010;

    shieldNode.scale.set(scaleX, scaleY, scaleZ);

    requestAnimationFrame(vibrar);
  }

  vibrar();

});
</script>

</body>
</html>
