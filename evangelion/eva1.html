<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>EVA AT Field</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>
body{
  margin:0;
  background:black;
  overflow:hidden;
}

model-viewer{
  width:100vw;
  height:100vh;
}
</style>
</head>

<body>

<model-viewer
  id="scene"
  src="evangelion1.glb"
  camera-controls
  auto-rotate
  exposure="1"
  shadow-intensity="1"
  environment-image="neutral"
  ar
  ar-modes="webxr scene-viewer quick-look"
>
</model-viewer>

<script>
window.addEventListener("DOMContentLoaded", () => {

  const viewer = document.querySelector("#scene");

  viewer.addEventListener("load", () => {

    console.log("Modelo cargado");

    viewer.model.materials.forEach(mat =>
      console.log("Material:", mat.name)
    );

    // 🔥 Detectar materiales tipo escudo (Material.02X)
    viewer.model.materials.forEach(mat => {

      if (mat.name.includes("Material.02")) {

        console.log("Aplicando efecto a:", mat.name);

        const pbr = mat.pbrMetallicRoughness;

        // --- CONFIG BASE ---
        pbr.setMetallicFactor(0.0);
        pbr.setRoughnessFactor(0.05);
        pbr.setBaseColorFactor([1, 0, 0, 0.55]);

        // --- EMISSIVE (brillo energético) ---
        mat.setEmissiveFactor([1.0, 0.2, 0.6]);

        // --- ANIMACIÓN RGB + PULSO ---
        let t = 0;

        function animar() {

          t += 0.03;

          const r = (Math.sin(t) + 1) / 2;
          const g = (Math.sin(t + 2) + 1) / 2;
          const b = (Math.sin(t + 4) + 1) / 2;

          const alpha = 0.45 + Math.sin(t * 2) * 0.1;

          pbr.setBaseColorFactor([r, g, b, alpha]);

          requestAnimationFrame(animar);
        }

        animar();
      }

    });

  });

});
</script>

</body>
</html>
