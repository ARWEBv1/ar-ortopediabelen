<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>EVA AT FIELD FINAL</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.01,
1000
);

camera.position.set(0,1.5,4);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;

let escudos=[];

const loader=new GLTFLoader();

loader.load("evangelion1.glb?v=70",(gltf)=>{

 const container=new THREE.Group();
 scene.add(container);

 const model=gltf.scene;
 container.add(model);

 container.position.y-=2;

 model.traverse((obj)=>{

  if(!obj.isMesh) return;

  if(obj.name==="escudo1" ||
     obj.name==="escudo2" ||
     obj.name==="escudo3"){

    const mat=new THREE.MeshBasicMaterial({
      color:0xffaa00,
      transparent:true,
      opacity:0.08, // 🔥 base translúcida real
      blending:THREE.AdditiveBlending,
      depthWrite:false,
      side:THREE.DoubleSide
    });

    obj.material=mat;
    escudos.push(obj);
  }

 });

});


// 🎨 Paleta tipo anime
const palette=[
 new THREE.Color(0xffb300), // dorado profundo
 new THREE.Color(0xff2200), // rojo
 new THREE.Color(0x0099ff), // azul
 new THREE.Color(0xffcc00), // dorado claro
 new THREE.Color(0xaa00ff), // violeta
 new THREE.Color(0xff9900)  // dorado
];


function animate(t){

 requestAnimationFrame(animate);

 const time=t*0.001;

 escudos.forEach((escudo,i)=>{

  if(!escudo) return;

  // ciclo de 4 segundos desfasado
  const ciclo=(time + i*1.2) % 4;

  let intensidad=0;

  if(ciclo < 1){
    intensidad = ciclo / 1; // sube
  }
  else if(ciclo < 2){
    intensidad = 1 - ((ciclo-1)/1); // baja
  }
  else{
    intensidad = 0; // descanso translúcido
  }

  // RGB dinámico
  const colorIndex=Math.floor(time*1.5 + i) % palette.length;
  escudo.material.color.copy(palette[colorIndex]);

  // 🔥 opacidad controlada
  escudo.material.opacity = 0.08 + intensidad*0.18;

  // vibración leve tipo forcejeo
  const s = 1 + Math.sin(time*30 + i)*0.01*intensidad;
  escudo.scale.set(s,s,s);

 });

 controls.update();
 renderer.render(scene,camera);

}

animate();

window.addEventListener("resize",()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
