<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Evangelion AR</title>

  <!-- Model Viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: black;
      overflow: hidden;
      height: 100%;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background-color: black;
    }
  </style>
</head>

<body>

  <model-viewer
    src="evangelion1.glb"
    ios-src="evangelion1.usdc"

    ar
    ar-modes="webxr scene-viewer quick-look"

    camera-controls
    auto-rotate

    exposure="0.7"
    shadow-intensity="1"
    shadow-softness="1"

    environment-image="https://modelviewer.dev/shared-assets/environments/neutral.hdr"

    tone-mapping="aces"
  >
  </model-viewer>

</body>
</html>
