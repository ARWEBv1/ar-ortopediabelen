<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>EVA AR</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
}

model-viewer {
  width: 100vw;
  height: 100vh;
}
</style>
</head>

<body>

<model-viewer
  id="scene"
  src="evangelion1.glb"
  camera-controls
  auto-rotate
  exposure="1"
  shadow-intensity="1"
  ar
  ar-modes="webxr scene-viewer quick-look"
  environment-image="neutral"
>
</model-viewer>

<script>
window.addEventListener("DOMContentLoaded", () => {

  const viewer = document.querySelector("#scene");

  viewer.addEventListener("load", () => {

    console.log("Modelo cargado");

    viewer.model.materials.forEach(mat =>
      console.log("Material:", mat.name)
    );

    // Ajustar todos los materiales tipo Material.02X
    viewer.model.materials.forEach(mat => {

      if (mat.name.includes("Material.02")) {

        const pbr = mat.pbrMetallicRoughness;

        pbr.setMetallicFactor(0.0);
        pbr.setRoughnessFactor(0.1);
        pbr.setBaseColorFactor([1, 0, 0, 0.35]);

        let t = 0;

        function animar() {
          t += 0.02;

          const r = (Math.sin(t) + 1) / 2;
          const g = (Math.sin(t + 2) + 1) / 2;
          const b = (Math.sin(t + 4) + 1) / 2;

          pbr.setBaseColorFactor([r, g, b, 0.35]);

          requestAnimationFrame(animar);
        }

        animar();
      }

    });

  });

});
</script>

</body>
</html>
