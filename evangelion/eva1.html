<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>EVA AT FIELD - DRAMA 2s</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
  }
}
</script>

</head>
<body>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.01,
  1000
);

camera.position.set(0, 1.5, 4);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.5));

const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(5,10,5);
scene.add(light);

let escudo1, escudo2, escudo3;
let anillos = [];

const loader = new GLTFLoader();

loader.load("evangelion1.glb?v=11", (gltf)=>{

  const container = new THREE.Group();
  scene.add(container);

  const model = gltf.scene;
  container.add(model);

  // 🔽 bajar 2 en Y como pediste
  container.position.y -= 2;

  model.traverse((obj)=>{

    if(!obj.isMesh) return;

    if(obj.name === "escudo1" ||
       obj.name === "escudo2" ||
       obj.name === "escudo3"){

      const shieldMat = new THREE.MeshStandardMaterial({
        color: 0xff7700,
        emissive: 0xff3300,
        emissiveIntensity: 0,
        transparent: true,
        opacity: 0.3,
        side: THREE.DoubleSide
      });

      obj.material = shieldMat;

      if(obj.name === "escudo1") escudo1 = obj;
      if(obj.name === "escudo2") escudo2 = obj;
      if(obj.name === "escudo3") escudo3 = obj;
    }

    if(obj.name.startsWith("anillo")){
      anillos.push(obj);

      obj.material = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0xffffff,
        emissiveIntensity: 6,
        transparent: true,
        opacity: 1,
        side: THREE.DoubleSide,
        depthWrite:false
      });
    }

  });

});

function romper(obj, base, intensidad, time){
  if(!obj) return;

  obj.position.x = Math.sin(time*40 + base)*intensidad;
  obj.position.y = Math.cos(time*35 + base)*intensidad;

  const caos = 1 + Math.sin(time*30 + base)*0.02;
  obj.scale.set(caos, caos, 1 + Math.sin(time*50 + base)*0.01);
}

function animate(t){

  requestAnimationFrame(animate);

  const time = t * 0.001;

  // 🔥 vibración ruptura
  romper(escudo3, 0, 0.05, time);
  romper(escudo2, 2, 0.025, time);
  romper(escudo1, 4, 0.01, time);

  // 🔥 CICLO EXACTO DE 2 SEGUNDOS
  const ciclo = time % 2;
  let intensidad = 0;

  if (ciclo < 0.5) {
    intensidad = ciclo / 0.5; 
  }
  else if (ciclo < 1.1) {
    intensidad = 1 - ((ciclo - 0.5) / 0.6);
  }
  else if (ciclo < 1.6) {
    intensidad = 0.08;
  }
  else {
    intensidad = (ciclo - 1.6) / 0.4 * 0.3;
  }

  [escudo1, escudo2, escudo3].forEach((e)=>{
    if(!e) return;

    e.material.emissiveIntensity = intensidad * 12;
    e.material.opacity = 0.25 + intensidad * 0.75;
  });

  // 🌈 RGB anillos vivos
  anillos.forEach((a,i)=>{

    const hue = (time*0.8 + i*0.2) % 1;
    const color = new THREE.Color().setHSL(hue,1,0.5);
    a.material.emissive = color;

    const pulso = 1 + Math.sin(time*20 + i)*0.03;
    a.scale.set(pulso, pulso, pulso);

    a.position.z = Math.sin(time*25 + i)*0.01;

  });

  controls.update();
  renderer.render(scene,camera);

}

animate();

window.addEventListener("resize", ()=>{

  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);

});

</script>

</body>
</html>
