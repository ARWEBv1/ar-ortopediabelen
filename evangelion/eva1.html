<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Evangelion AT Field - Forcejeo</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
body{
  margin:0;
  background:black;
  overflow:hidden;
}

/* Modelo */
model-viewer{
  width:100vw;
  height:100vh;
  animation: forcejeo 0.15s infinite alternate;
}

/* Vibración tipo presión */
@keyframes forcejeo {
  0%   { transform: scale3d(1,1,1); }
  50%  { transform: scale3d(1.01,1.01,0.99); }
  100% { transform: scale3d(1.015,1.015,0.985); }
}

/* Pulso energético en el punto de impacto */
#impacto{
  position:absolute;
  top:50%;
  left:50%;
  width:140px;
  height:140px;
  margin-left:-70px;
  margin-top:-70px;
  border:4px solid rgba(255,0,80,0.9);
  border-radius:50%;
  animation: pulso 0.8s infinite;
  pointer-events:none;
  box-shadow: 0 0 20px rgba(255,0,80,0.8);
}

/* Animación del pulso */
@keyframes pulso{
  0% { transform: scale(0.5); opacity:1; }
  100% { transform: scale(2); opacity:0; }
}

</style>
</head>

<body>

<model-viewer
  src="evangelion1.glb?v=5"
  camera-controls
  exposure="1"
  shadow-intensity="1"
  environment-image="neutral"
>
</model-viewer>

<div id="impacto"></div>

</body>
</html>
