<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>EVA AT FIELD</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background: black;
    }
  </style>
</head>
<body>

<model-viewer
  id="scene"
  src="evangelion1.glb"
  camera-controls
  exposure="1"
  shadow-intensity="1"
  environment-image="https://modelviewer.dev/shared-assets/environments/neutral.hdr">
</model-viewer>

<script>
window.addEventListener("DOMContentLoaded", () => {

  const viewer = document.getElementById("scene");

  viewer.addEventListener("load", () => {

    console.log("Modelo cargado correctamente");

    const materiales = viewer.model.materials;

    // 🔥 Forzamos transparencia en TODOS
    materiales.forEach(mat => {

      // Forzar alphaMode a BLEND si viene OPAQUE
      mat.alphaMode = "BLEND";

      const pbr = mat.pbrMetallicRoughness;

      // Ajuste base inicial
      pbr.setBaseColorFactor([1, 0.2, 0.2, 0.7]);
      mat.setEmissiveFactor([1, 0.2, 0.2]);
    });

    // 🔥 ANIMACIÓN RGB FUERTE
    let t = 0;

    function animar() {

      t += 0.06;

      const r = (Math.sin(t) + 1) / 2;
      const g = (Math.sin(t + 2) + 1) / 2;
      const b = (Math.sin(t + 4) + 1) / 2;

      const intensidad = 2.2;

      const rr = Math.min(r * intensidad, 1);
      const gg = Math.min(g * intensidad, 1);
      const bb = Math.min(b * intensidad, 1);

      materiales.forEach(mat => {

        const pbr = mat.pbrMetallicRoughness;

        // Color fuerte + transparencia real
        pbr.setBaseColorFactor([rr, gg, bb, 0.65]);

        // Glow energético
        mat.setEmissiveFactor([rr, gg, bb]);
      });

      requestAnimationFrame(animar);
    }

    animar();

  });

});
</script>

</body>
</html>
