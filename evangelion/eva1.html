<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>EVA AT FIELD CONTROL</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
}

#btnStop, #btnShot{
 position:fixed;
 top:20px;
 padding:10px 18px;
 font-weight:bold;
 border:none;
 cursor:pointer;
 z-index:10;
}

#btnStop{
 left:20px;
 background:#ff0055;
 color:white;
}

#btnShot{
 left:160px;
 background:#00bfff;
 color:white;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<button id="btnStop">DETENER</button>
<button id="btnShot">📸 CAPTURA</button>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const btnStop = document.getElementById("btnStop");
const btnShot = document.getElementById("btnShot");

let running = true;

btnStop.onclick = ()=>{
  running = !running;
  btnStop.textContent = running ? "DETENER" : "CONTINUAR";
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.01,
1000
);

camera.position.set(0,1.5,4);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.preserveDrawingBuffer = true; // necesario para capturar
document.body.appendChild(renderer.domElement);

btnShot.onclick = ()=>{
 renderer.render(scene,camera);
 const link = document.createElement("a");
 link.download = "eva_sachiel.png";
 link.href = renderer.domElement.toDataURL("image/png");
 link.click();
};

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;

// iluminación correcta
scene.add(new THREE.AmbientLight(0xffffff,0.35));
const dirLight = new THREE.DirectionalLight(0xffffff,1.4);
dirLight.position.set(5,10,5);
scene.add(dirLight);

let escudos=[];

const loader=new GLTFLoader();

loader.load("evangelion1.glb?v=1100",(gltf)=>{

 const container=new THREE.Group();
 scene.add(container);

 const model=gltf.scene;
 container.add(model);
 container.position.y -= 2;

 model.traverse((obj)=>{

  if(!obj.isMesh) return;

  if(obj.name==="escudo1" ||
     obj.name==="escudo2" ||
     obj.name==="escudo3"){

    const material = new THREE.ShaderMaterial({

      transparent:true,
      depthWrite:false,
      side:THREE.DoubleSide,

      uniforms:{
        time:{value:0},
        offset:{value:0},
        reset:{value:0}
      },

      vertexShader:`
        varying vec2 vUv;
        void main(){
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
        }
      `,

      fragmentShader:`
        varying vec2 vUv;
        uniform float time;
        uniform float offset;
        uniform float reset;

        void main(){

          if(reset > 0.5){
            gl_FragColor = vec4(1.0,1.0,1.0,0.05);
            return;
          }

          float flow = vUv.y + time*1.5 + offset;

          vec3 c1 = vec3(1.0,0.6,0.0);
          vec3 c2 = vec3(1.0,0.0,0.0);
          vec3 c3 = vec3(0.0,0.4,1.0);
          vec3 c4 = vec3(0.7,0.0,1.0);

          float m = mod(flow,4.0);
          vec3 color;

          if(m < 1.0) color = mix(c1,c2,m);
          else if(m < 2.0) color = mix(c2,c3,m-1.0);
          else if(m < 3.0) color = mix(c3,c4,m-2.0);
          else color = mix(c4,c1,m-3.0);

          float alpha = 0.05 + 0.08 * sin(flow*8.0);

          gl_FragColor = vec4(color, alpha);
        }
      `
    });

    obj.material = material;
    escudos.push(obj);
  }

 });

});

function animate(t){

 requestAnimationFrame(animate);

 if(running){

   const time = t*0.001;
   const resetWindow = (time % 2.0) < 0.25;

   escudos.forEach((e,i)=>{
     e.material.uniforms.time.value = time;
     e.material.uniforms.offset.value = i*0.8;
     e.material.uniforms.reset.value = resetWindow ? 1.0 : 0.0;
   });

 }

 controls.update();
 renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>
</body>
</html>
