<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>EVA AT FIELD REFINED</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.01,
1000
);

camera.position.set(0,1.5,4);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff,1.5));

let escudos=[];
let anillos=[];

const loader=new GLTFLoader();

loader.load("evangelion1.glb?v=90",(gltf)=>{

 const container=new THREE.Group();
 scene.add(container);

 const model=gltf.scene;
 container.add(model);

 container.position.y -= 2;

 model.traverse((obj)=>{

  if(!obj.isMesh) return;

  // ESCUDOS
  if(obj.name==="escudo1" ||
     obj.name==="escudo2" ||
     obj.name==="escudo3"){

    const mat = new THREE.MeshStandardMaterial({
      color: 0xff8800,
      emissive: 0xff5500,
      emissiveIntensity: 0,
      transparent: true,
      opacity: 0.12, // translúcido base
      side: THREE.DoubleSide,
      depthWrite: false
    });

    obj.material = mat;
    escudos.push(obj);
  }

  // ANILLOS RGB
  if(obj.name.includes("anillo")){
    obj.material.emissive = new THREE.Color(0xffaa00);
    obj.material.emissiveIntensity = 3;
    anillos.push(obj);
  }

 });

});


// 🎨 Paleta anime profunda
const palette=[
 0xffb300, // dorado profundo
 0xff0000, // rojo
 0x0099ff, // azul
 0xffcc00, // dorado
 0xaa00ff, // violeta
 0xff8800  // dorado fuego
];


function animate(t){

 requestAnimationFrame(animate);

 const time=t*0.001;

 // 🔥 Reset global cada 2 segundos
 const pausaGlobal = (time % 2) < 0.25;

 escudos.forEach((obj,i)=>{

  if(!obj) return;

  if(pausaGlobal){
    obj.material.emissiveIntensity = 0;
    obj.material.opacity = 0.12;
    obj.scale.set(1,1,1);
    return;
  }

  // Ciclo individual 4s desfasado
  const ciclo=(time + i*1.2) % 4;

  let intensidad=0;

  if(ciclo < 1){
    intensidad = ciclo;
  }
  else if(ciclo < 2){
    intensidad = 1 - (ciclo-1);
  }
  else{
    intensidad = 0;
  }

  // Emisión controlada
  obj.material.emissiveIntensity = intensidad * 6;

  // Opacidad controlada (no tapa modelo)
  obj.material.opacity = 0.12 + intensidad * 0.35;

  // Vibración leve tipo forcejeo
  const s = 1 + Math.sin(time*25 + i)*0.01*intensidad;
  obj.scale.set(s,s,s);

 });


 // 🔥 RGB anime en anillos
 anillos.forEach((a,i)=>{

  const color = new THREE.Color(
    palette[Math.floor(time*1.5 + i) % palette.length]
  );

  a.material.emissive = color;

  const pulso = 1 + Math.sin(time*20 + i)*0.03;
  a.scale.set(pulso,pulso,pulso);

 });

 controls.update();
 renderer.render(scene,camera);

}

animate();

window.addEventListener("resize",()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
