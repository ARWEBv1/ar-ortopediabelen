<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
body{
  margin:0;
  background:black;
}

model-viewer{
  width:100vw;
  height:100vh;
  background:black;
}
</style>
</head>

<body>

<model-viewer
  src="evangelion1.glb"

  camera-controls
  auto-rotate

  environment-image="neutral"
  exposure="1.4"

  shadow-intensity="0.8"
  tone-mapping="commerce"

  interaction-prompt="none"
  skybox-image=""
>
</model-viewer>

</body>
</html>
