<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: black; /* fondo oscuro */
  overflow: hidden;
}

model-viewer {
  width: 100vw;
  height: 100vh;
  background-color: black;
}
</style>

</head>

<body>

<model-viewer
  src="evangelion1.glb"
  camera-controls
  auto-rotate
  exposure="0.7"
  environment-image="neutral"
  tone-mapping="neutral"
  shadow-intensity="0"
  ar>
</model-viewer>

</body>
</html>
