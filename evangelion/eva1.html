<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>EVA AT FIELD BALANCED</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.01,
1000
);

camera.position.set(0,1.5,4);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;


// 🔥 ILUMINACIÓN CORRECTA (DEVUELVE VOLUMEN AL EVA)

const ambient = new THREE.AmbientLight(0xffffff, 0.35);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);


let escudos=[];
let anillos=[];

const loader=new GLTFLoader();

loader.load("evangelion1.glb?v=300",(gltf)=>{

 const container=new THREE.Group();
 scene.add(container);

 const model=gltf.scene;
 container.add(model);

 container.position.y -= 2;

 model.traverse((obj)=>{

  if(!obj.isMesh) return;

  // ESCUDOS (energía plana, no afecta iluminación del EVA)
  if(obj.name==="escudo1" ||
     obj.name==="escudo2" ||
     obj.name==="escudo3"){

    const mat = new THREE.MeshBasicMaterial({
      color: 0xff8800,
      transparent: true,
      opacity: 0.10,
      depthWrite: false,
      side: THREE.DoubleSide
    });

    obj.material = mat;
    escudos.push(obj);
  }

  // ANILLOS RGB
  if(obj.name.includes("anillo")){
    obj.material = new THREE.MeshBasicMaterial({
      color: 0xffaa00
    });
    anillos.push(obj);
  }

 });

});

const palette=[
 0xffb300,
 0xff0000,
 0x0099ff,
 0xffcc00,
 0xaa00ff,
 0xff8800
];

function animate(t){

 requestAnimationFrame(animate);

 const time = t * 0.001;

 // Reset global cada 1 segundo
 const resetGlobal = (time % 1) < 0.2;

 escudos.forEach((obj,i)=>{

  if(resetGlobal){

    obj.material.opacity = 0.10;
    obj.material.color.set(0xff8800);
    obj.scale.set(1,1,1);
    return;
  }

  const ciclo = (time + i*0.8) % 3;

  let intensidad=0;

  if(ciclo < 0.8){
    intensidad = ciclo / 0.8;
  }
  else if(ciclo < 1.6){
    intensidad = 1 - ((ciclo-0.8)/0.8);
  }

  obj.material.color.set(
    palette[Math.floor(time*1.5 + i) % palette.length]
  );

  obj.material.opacity = 0.10 + intensidad * 0.25;

  const s = 1 + Math.sin(time*30 + i)*0.01*intensidad;
  obj.scale.set(s,s,s);

 });

 // RGB en anillos
 anillos.forEach((a,i)=>{

  a.material.color.set(
    palette[Math.floor(time*1.5 + i) % palette.length]
  );

  const pulso = 1 + Math.sin(time*20 + i)*0.03;
  a.scale.set(pulso,pulso,pulso);

 });

 controls.update();
 renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
