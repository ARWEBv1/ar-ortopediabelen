<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>EVA CONTROL REAL</title>
<style>
body{ margin:0; overflow:hidden; background:black; }
</style>
</head>
<body>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
 }
}
</script>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

let scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

let camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.01, 1000);
camera.position.set(0,1.5,4);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

let controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff,2));

let dirLight = new THREE.DirectionalLight(0xff00aa,3);
dirLight.position.set(5,10,5);
scene.add(dirLight);

let shieldWrapper = new THREE.Group();
scene.add(shieldWrapper);

let shieldMesh = null;

const loader = new GLTFLoader();

loader.load("evangelion1.glb",(gltf)=>{

 let model = gltf.scene;
 scene.add(model);

 model.traverse((obj)=>{

   if(obj.isMesh && obj.name === "redondo2.001"){

     shieldMesh = obj;

     // guardar posición original
     let worldPos = new THREE.Vector3();
     obj.getWorldPosition(worldPos);

     // quitarlo del modelo original
     obj.parent.remove(obj);

     // agregarlo a wrapper
     shieldWrapper.add(obj);

     shieldWrapper.position.copy(worldPos);

     obj.position.set(0,0,0);

     obj.material = new THREE.MeshStandardMaterial({
       color:0xff0066,
       emissive:0xff0033,
       emissiveIntensity:1.5,
       roughness:0.35,
       metalness:0
     });

     console.log("Escudo aislado correctamente");
   }

 });

});

function animate(t){

 requestAnimationFrame(animate);

 if(shieldWrapper){

   // vibración real
   shieldWrapper.rotation.z = Math.sin(t*0.02)*0.05;
   shieldWrapper.rotation.x = Math.cos(t*0.018)*0.04;

   let scale = 1 + Math.sin(t*0.006)*0.12;
   shieldWrapper.scale.set(scale,scale,scale);
 }

 controls.update();
 renderer.render(scene,camera);
}

animate();

addEventListener("resize",()=>{
 camera.aspect = innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
