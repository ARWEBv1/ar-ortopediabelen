<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>AT Field Forcejeo</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
body{
  margin:0;
  background:black;
  overflow:hidden;
}

model-viewer{
  width:100vw;
  height:100vh;
  animation: vibrar 0.12s infinite alternate;
}

@keyframes vibrar {
  0%   { transform: scale(1) rotateZ(0deg); }
  100% { transform: scale(1.01) rotateZ(0.2deg); }
}
</style>
</head>

<body>

<model-viewer
  src="evangelion1.glb?v=4"
  camera-controls
  exposure="1"
  shadow-intensity="1"
  environment-image="neutral">
</model-viewer>

</body>
</html>
