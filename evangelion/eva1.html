<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>EVA TEST LIMPIO</title>
<style>
body{margin:0;overflow:hidden;background:black;}
</style>
</head>
<body>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
 }
}
</script>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

let scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

let camera = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.01,1000);
camera.position.set(0,1.5,4);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

let controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff,2));

let dir = new THREE.DirectionalLight(0xffffff,3);
dir.position.set(5,10,5);
scene.add(dir);

let shield = null;

const loader = new GLTFLoader();

loader.load("evangelion1.glb",(gltf)=>{

 const model = gltf.scene;
 scene.add(model);

 model.traverse(obj=>{

   if(obj.isMesh){
     console.log("Mesh:",obj.name);

     if(obj.name === "redondo2.001"){
       shield = obj;

       shield.material = new THREE.MeshStandardMaterial({
         color:0xff0066,
         emissive:0xff0033,
         emissiveIntensity:2,
         roughness:0.3,
         metalness:0
       });

       console.log("ESCUDO DETECTADO");
     }
   }

 });

});

function animate(t){

 requestAnimationFrame(animate);

 if(shield){

   // SOLO ROTACIÓN LOCAL
   shield.rotation.z += 0.01;

   // SOLO EMISSIVE PULSANTE
   const pulse = (Math.sin(t*0.005)+1)/2;
   shield.material.emissiveIntensity = 1 + pulse*2;
 }

 controls.update();
 renderer.render(scene,camera);
}

animate();

addEventListener("resize",()=>{
 camera.aspect = innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
