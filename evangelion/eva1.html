<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>EVA CINEMÁTICO</title>
<style>
body{
 margin:0;
 overflow:hidden;
 background:black;
}
</style>
</head>
<body>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
 }
}
</script>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

let scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

let camera = new THREE.PerspectiveCamera(
60, innerWidth/innerHeight, 0.01, 1000
);

camera.position.set(0,1.5,4);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

let controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff,2));

let dirLight = new THREE.DirectionalLight(0xff00aa,3);
dirLight.position.set(5,10,5);
scene.add(dirLight);

let shieldBig = null;
let lightning = [];

const loader = new GLTFLoader();

loader.load(
"evangelion1.glb",
(gltf)=>{

 let model = gltf.scene;
 scene.add(model);

 model.traverse((obj)=>{

  if(obj.isMesh){

   if(obj.name === "redondo2.001"){
     shieldBig = obj;

     shieldBig.material = new THREE.MeshStandardMaterial({
       color:0xff0066,
       emissive:0xff0033,
       emissiveIntensity:1,
       roughness:0.4,
       metalness:0
     });
   }
  }
 });

});

// --------- RAYOS ----------
function spawnLightning(origin){

 const material = new THREE.LineBasicMaterial({
  color:0xffffff
 });

 const points = [];
 points.push(origin.clone());

 const dir = new THREE.Vector3(
  Math.random()-0.5,
  Math.random()-0.5,
  Math.random()-0.5
 ).normalize();

 const end = origin.clone().add(dir.multiplyScalar(2 + Math.random()*2));

 points.push(end);

 const geometry = new THREE.BufferGeometry().setFromPoints(points);

 const line = new THREE.Line(geometry, material);
 scene.add(line);

 lightning.push({line,life:20});
}

// --------- ANIMATE ----------
function animate(t){

 requestAnimationFrame(animate);

 if(shieldBig){

   // 1️⃣ Vibración
   shieldBig.position.x = Math.sin(t*0.01)*0.05;
   shieldBig.position.y = Math.cos(t*0.012)*0.03;

   // 2️⃣ Pulsación escala
   let scale = 1 + Math.sin(t*0.006)*0.08;
   shieldBig.scale.set(scale,scale,scale);

   // 3️⃣ Cambio color presión
   let r = (Math.sin(t*0.005)+1)/2;
   shieldBig.material.color.setRGB(1,r*0.2,r*0.4);

   // 4️⃣ Rayos ocasionales
   if(Math.random()<0.03){
     shieldBig.getWorldPosition(new THREE.Vector3());
     spawnLightning(shieldBig.position.clone());
   }
 }

 // eliminar rayos viejos
 lightning.forEach((l,i)=>{
   l.life--;
   if(l.life<=0){
     scene.remove(l.line);
     lightning.splice(i,1);
   }
 });

 controls.update();
 renderer.render(scene,camera);
}

animate();

addEventListener("resize",()=>{
 camera.aspect = innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
