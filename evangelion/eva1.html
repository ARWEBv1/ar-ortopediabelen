<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>EVA AT FIELD - GRIETA HORIZONTAL</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.01, 1000);
camera.position.set(0,1.5,4);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff,0.35));
const light = new THREE.DirectionalLight(0xffffff,1.4);
light.position.set(5,10,5);
scene.add(light);

let escudos = [];

const loader = new GLTFLoader();

loader.load("evangelion1.glb", (gltf)=>{

  const model = gltf.scene;
  scene.add(model);
  model.position.y -= 2;

  model.traverse(obj=>{

    if(!obj.isMesh) return;

    if(obj.name==="escudo1" ||
       obj.name==="escudo2" ||
       obj.name==="escudo3"){

      const material = new THREE.ShaderMaterial({

        transparent:true,
        depthWrite:false,
        side:THREE.DoubleSide,

        uniforms:{
          time:{value:0},
          offset:{value:0},
          reset:{value:0},
          crackOpen:{value:0}
        },

        vertexShader:`
          varying vec2 vUv;
          varying vec3 vWorldPos;

          void main(){
            vUv = uv;
            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
            vWorldPos = worldPosition.xyz;
            gl_Position = projectionMatrix * viewMatrix * worldPosition;
          }
        `,

        fragmentShader:`
          varying vec2 vUv;
          varying vec3 vWorldPos;

          uniform float time;
          uniform float offset;
          uniform float reset;
          uniform float crackOpen;

          void main(){

            // -------- GRIETA HORIZONTAL --------

            float heightCenter = 2.0;   // 🔻 bajada 1 unidad
            float width = 0.05 + crackOpen * 0.25;

            float dist = abs(vWorldPos.y - heightCenter);

            float horizontalMask =
              step(-1.0, vWorldPos.x) *
              step(vWorldPos.x, 1.0);

            float noise =
              sin(vWorldPos.x * 30.0 + time * 20.0) * 0.01;

            if(dist < width + noise && horizontalMask > 0.5){
              discard;
            }

            // -------- RESET --------

            if(reset > 0.5){
              gl_FragColor = vec4(1.0,1.0,1.0,0.05);
              return;
            }

            // -------- RGB --------

            float flow = vUv.y + time*2.0 + offset;

            vec3 c1 = vec3(1.0,0.6,0.0);
            vec3 c2 = vec3(1.0,0.0,0.0);
            vec3 c3 = vec3(0.0,0.4,1.0);
            vec3 c4 = vec3(0.7,0.0,1.0);

            float m = mod(flow,4.0);
            vec3 color;

            if(m < 1.0) color = mix(c1,c2,m);
            else if(m < 2.0) color = mix(c2,c3,m-1.0);
            else if(m < 3.0) color = mix(c3,c4,m-2.0);
            else color = mix(c4,c1,m-3.0);

            float alpha = 0.04 + 0.08 * sin(flow*8.0);

            gl_FragColor = vec4(color, alpha);
          }
        `
      });

      obj.material = material;
      escudos.push(obj);
    }

  });

});

function animate(t){

  requestAnimationFrame(animate);

  const time = t * 0.001;

  let cycle = time % 4.0;
  let crackValue = 0;

  if(cycle > 2.0 && cycle < 3.0){
    crackValue = cycle - 2.0;
  }

  if(cycle >= 3.0 && cycle < 3.5){
    crackValue = 1.0;
  }

  if(cycle >= 3.5){
    crackValue = 1.0 - (cycle - 3.5) * 2.0;
  }

  crackValue = Math.max(0, Math.min(1, crackValue));

  escudos.forEach((e,i)=>{
    e.material.uniforms.time.value = time;
    e.material.uniforms.offset.value = i * 0.8;
    e.material.uniforms.reset.value = 0.0;
    e.material.uniforms.crackOpen.value = crackValue;
  });

  controls.update();
  renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
