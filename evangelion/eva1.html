<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
body{
  margin:0;
  background:black;
  overflow:hidden;
}
model-viewer{
  width:100vw;
  height:100vh;
}
</style>
</head>

<body>

<model-viewer
  id="scene"
  src="evangelion1.glb"
  camera-controls
  exposure="1"
  shadow-intensity="1"
  environment-image="https://modelviewer.dev/shared-assets/environments/neutral.hdr"
  ar>
</model-viewer>

<script>
window.addEventListener("DOMContentLoaded", () => {

  const viewer = document.querySelector("#scene");

  viewer.addEventListener("load", () => {

    console.log("Modelo cargado");

    const materiales = viewer.model.materials;

    materiales.forEach((mat, index) => {

      console.log("Material:", mat.name);

      // 🔥 FORZAR MODO BLEND
      mat.alphaMode = "BLEND";

      const pbr = mat.pbrMetallicRoughness;

      // Transparencia inicial fuerte
      pbr.setBaseColorFactor([1, 0, 0, 0.7]);
      mat.setEmissiveFactor([1, 0, 0]);

      // Guardamos referencia para animación
      mat._pbr = pbr;
    });

    // 🔥 ANIMACIÓN RGB FUERTE
    let t = 0;

    function animar(){
      t += 0.06;

      const r = (Math.sin(t) + 1) / 2;
      const g = (Math.sin(t + 2) + 1) / 2;
      const b = (Math.sin(t + 4) + 1) / 2;

      const intensidad = 2.2;

      const rr = Math.min(r * intensidad, 1);
      const gg = Math.min(g * intensidad, 1);
      const bb = Math.min(b * intensidad, 1);

      materiales.forEach(mat=>{
        const pbr = mat._pbr;
        pbr.setBaseColorFactor([rr, gg, bb, 0.75]);
        mat.setEmissiveFactor([rr, gg, bb]);
      });

      requestAnimationFrame(animar);
    }

    animar();

  });

});
</script>

</body>
</html>
