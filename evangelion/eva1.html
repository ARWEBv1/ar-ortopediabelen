<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>EVA AT FIELD APOCALYPSE</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
}

#btnStop,#btnShot{
 position:fixed;
 top:20px;
 padding:10px 18px;
 font-weight:bold;
 border:none;
 cursor:pointer;
 z-index:10;
}

#btnStop{left:20px;background:#ff0055;color:white;}
#btnShot{left:160px;background:#00bfff;color:white;}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<button id="btnStop">DETENER</button>
<button id="btnShot">📸 CAPTURA</button>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const btnStop=document.getElementById("btnStop");
const btnShot=document.getElementById("btnShot");

let running=true;
btnStop.onclick=()=>{
 running=!running;
 btnStop.textContent=running?"DETENER":"CONTINUAR";
};

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x000000);

const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.01,1000);
camera.position.set(0,1.5,4);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.preserveDrawingBuffer=true;
document.body.appendChild(renderer.domElement);

btnShot.onclick=()=>{
 renderer.render(scene,camera);
 const link=document.createElement("a");
 link.download="eva_sachiel.png";
 link.href=renderer.domElement.toDataURL("image/png");
 link.click();
};

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;

// iluminación
scene.add(new THREE.AmbientLight(0xffffff,0.35));
const light=new THREE.DirectionalLight(0xffffff,1.4);
light.position.set(5,10,5);
scene.add(light);

let escudos=[];
let anillos=[];
let shockwaves=[];
let dustParticles=[];
let lightningLines=[];
let lastResetState=false;

// --------- SHOCKWAVES ----------
function createShockwaves(){
 for(let i=0;i<4;i++){
  const geo=new THREE.CircleGeometry(0.2,64);
  const mat=new THREE.MeshBasicMaterial({
   color:0xffffff,
   transparent:true,
   opacity:0,
   depthWrite:false,
   side:THREE.DoubleSide
  });
  const wave=new THREE.Mesh(geo,mat);
  wave.rotation.x=-Math.PI/2;
  wave.position.y=-2.05;
  wave.userData.life=0;
  scene.add(wave);
  shockwaves.push(wave);
 }
}
createShockwaves();

// --------- POLVO LATERAL ----------
function createDust(){
 const geo=new THREE.BufferGeometry();
 const count=200;
 const positions=new Float32Array(count*3);

 for(let i=0;i<count;i++){
  positions[i*3]= (Math.random()-0.5)*1;
  positions[i*3+1]= -2;
  positions[i*3+2]= (Math.random()-0.5)*1;
 }

 geo.setAttribute("position",new THREE.BufferAttribute(positions,3));

 const mat=new THREE.PointsMaterial({
  color:0xffffff,
  size:0.05,
  transparent:true,
  opacity:0.6,
  depthWrite:false
 });

 const points=new THREE.Points(geo,mat);
 scene.add(points);
 dustParticles.push(points);
}
createDust();

// --------- RAYOS ----------
function createLightning(){
 for(let i=0;i<8;i++){
  const mat=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0});
  const geo=new THREE.BufferGeometry();
  const line=new THREE.Line(geo,mat);
  scene.add(line);
  lightningLines.push(line);
 }
}
createLightning();

const loader=new GLTFLoader();

loader.load("evangelion1.glb?v=9999",(gltf)=>{

 const container=new THREE.Group();
 scene.add(container);

 const model=gltf.scene;
 container.add(model);
 container.position.y -= 2;

 model.traverse(obj=>{

  if(!obj.isMesh) return;

  // ESCUDOS
  if(obj.name==="escudo1"||obj.name==="escudo2"||obj.name==="escudo3"){

   const material=new THREE.ShaderMaterial({
    transparent:true,
    depthWrite:false,
    side:THREE.DoubleSide,
    uniforms:{
     time:{value:0},
     offset:{value:0},
     reset:{value:0}
    },
    vertexShader:`
     varying vec2 vUv;
     void main(){
      vUv=uv;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
     }
    `,
    fragmentShader:`
     varying vec2 vUv;
     uniform float time;
     uniform float offset;
     uniform float reset;

     void main(){

      if(reset>0.5){
       gl_FragColor=vec4(1.0,1.0,1.0,0.05);
       return;
      }

      float flow=vUv.y+time*2.0+offset;

      vec3 c1=vec3(1.0,0.6,0.0);
      vec3 c2=vec3(1.0,0.0,0.0);
      vec3 c3=vec3(0.0,0.4,1.0);
      vec3 c4=vec3(0.7,0.0,1.0);

      float m=mod(flow,4.0);
      vec3 color;

      if(m<1.0) color=mix(c1,c2,m);
      else if(m<2.0) color=mix(c2,c3,m-1.0);
      else if(m<3.0) color=mix(c3,c4,m-2.0);
      else color=mix(c4,c1,m-3.0);

      float alpha=0.04+0.08*sin(flow*8.0);

      gl_FragColor=vec4(color,alpha);
     }
    `
   });

   obj.material=material;
   escudos.push(obj);
  }

  // ANILLOS
  if(obj.name.includes("anillo")){
   const idx=anillos.length;
   const mat=new THREE.MeshBasicMaterial({
    color:new THREE.Color(`hsl(${idx*60},100%,50%)`),
    transparent:true,
    opacity:0.8
   });
   obj.material=mat;
   anillos.push(obj);
  }

 });

});

function animate(t){
 requestAnimationFrame(animate);

 if(running){

  const time=t*0.001;
  const resetWindow=(time%2.0)<0.25;

  // detectar inicio de reset para impacto
  if(resetWindow && !lastResetState){
   shockwaves.forEach(w=>w.userData.life=0.01);
   camera.position.x+=(Math.random()-0.5)*0.05;
   camera.position.y+=(Math.random()-0.5)*0.05;
  }

  lastResetState=resetWindow;

  escudos.forEach((e,i)=>{
   e.material.uniforms.time.value=time;
   e.material.uniforms.offset.value=i*0.8;
   e.material.uniforms.reset.value=resetWindow?1:0;
  });

  // shockwave
  shockwaves.forEach(w=>{
   if(w.userData.life>0){
    w.userData.life+=0.03;
    const s=w.userData.life*6;
    w.scale.set(s,s,s);
    w.material.opacity=0.4-w.userData.life*0.4;
    if(w.userData.life>1) w.userData.life=0;
   }
  });

  // polvo lateral
  dustParticles.forEach(p=>{
   const arr=p.geometry.attributes.position.array;
   for(let i=0;i<arr.length/3;i++){
    arr[i*3]+= (arr[i*3])*0.02;
    arr[i*3+2]+= (arr[i*3+2])*0.02;
    if(Math.abs(arr[i*3])>3){
     arr[i*3]=(Math.random()-0.5);
     arr[i*3+2]=(Math.random()-0.5);
    }
   }
   p.geometry.attributes.position.needsUpdate=true;
  });

  // rayos al piso
  lightningLines.forEach(l=>{
   if(resetWindow){
    const points=[
     new THREE.Vector3(0,1,0),
     new THREE.Vector3((Math.random()-0.5)*2,-2,(Math.random()-0.5)*2)
    ];
    l.geometry.setFromPoints(points);
    l.material.opacity=0.6;
   }else{
    l.material.opacity=0;
   }
  });

 }

 controls.update();
 renderer.render(scene,camera);
}

animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
