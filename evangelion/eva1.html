<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>EVA AT FIELD - GLOBAL RESET</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
  }
}
</script>

</head>
<body>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
60,
window.innerWidth / window.innerHeight,
0.01,
1000
);

camera.position.set(0, 1.5, 4);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
scene.add(new THREE.DirectionalLight(0xffffff, 2));

let escudo1, escudo2, escudo3;
let anillos = [];

const loader = new GLTFLoader();

loader.load("evangelion1.glb?v=40", (gltf)=>{

  const container = new THREE.Group();
  scene.add(container);

  const model = gltf.scene;
  container.add(model);

  container.position.y -= 2;

  model.traverse((obj)=>{

    if(!obj.isMesh) return;

    if(obj.name === "escudo1" ||
       obj.name === "escudo2" ||
       obj.name === "escudo3"){

      const mat = new THREE.MeshStandardMaterial({
        color: 0xff8800,
        emissive: 0xff3300,
        emissiveIntensity: 0,
        transparent:true,
        opacity:0.15,
        side:THREE.DoubleSide
      });

      obj.material = mat;

      if(obj.name==="escudo1") escudo1=obj;
      if(obj.name==="escudo2") escudo2=obj;
      if(obj.name==="escudo3") escudo3=obj;
    }

    if(obj.name.startsWith("anillo")){
      anillos.push(obj);

      obj.material = new THREE.MeshStandardMaterial({
        color:0xffffff,
        emissive:0xffffff,
        emissiveIntensity:6,
        transparent:true,
        opacity:1,
        side:THREE.DoubleSide,
        depthWrite:false
      });
    }

  });

});

function cicloEscudo(time, offset){

  const ciclo = (time - offset + 4) % 4;
  let intensidad = 0;

  if (ciclo < 0.5) {
    intensidad = ciclo / 0.5;
  }
  else if (ciclo < 1.2) {
    intensidad = 1 - ((ciclo - 0.5) / 0.7);
  }
  else if (ciclo < 3) {
    intensidad = 0.05;
  }
  else {
    intensidad = (ciclo - 3) * 0.2;
  }

  return intensidad;
}

function romper(obj, intensidad, time){
  if(!obj) return;

  obj.position.x = Math.sin(time*40)*0.02*intensidad;
  obj.position.y = Math.cos(time*35)*0.02*intensidad;

  const caos = 1 + Math.sin(time*30)*0.02*intensidad;
  obj.scale.set(caos, caos, 1 + Math.sin(time*50)*0.01*intensidad);
}

function animate(t){

  requestAnimationFrame(animate);

  const time = t * 0.001;

  // 🔥 RESET GLOBAL CADA 1 SEGUNDO
  const pausaGlobal = (time % 1) < 0.18;

  const i1 = cicloEscudo(time, 0);
  const i2 = cicloEscudo(time, 1);
  const i3 = cicloEscudo(time, 2);

  [ [escudo1,i1], [escudo2,i2], [escudo3,i3] ].forEach(pair=>{

    const obj = pair[0];
    const intensidad = pair[1];

    if(!obj) return;

    if(pausaGlobal){
      obj.material.emissiveIntensity = 0;
      obj.material.opacity = 0.15;
      obj.scale.set(1,1,1);
      return;
    }

    obj.material.emissiveIntensity = intensidad * 12;
    obj.material.opacity = 0.15 + intensidad * 0.85;

    romper(obj,intensidad,time);

  });

  // RGB anillos
  anillos.forEach((a,i)=>{

    const hue = (time*0.6 + i*0.2) % 1;
    a.material.emissive = new THREE.Color().setHSL(hue,1,0.5);

    const pulso = 1 + Math.sin(time*20 + i)*0.03;
    a.scale.set(pulso,pulso,pulso);

  });

  controls.update();
  renderer.render(scene,camera);

}

animate();

window.addEventListener("resize",()=>{
camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
