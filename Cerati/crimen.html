<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Crimen - Cerati</title>

<style>
body{
    margin:0;
    background:black;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
}

/* VIDEO COMO BLOQUE NORMAL */
#video{
    width:100%;
    max-height:75vh;
    background:black;
}

/* BOTONES ABAJO (NO ENCIMA) */
.botones{
    margin-top:15px;
    display:flex;
    gap:10px;
}

button{
    background:black;
    color:#00ffff;
    border:1px solid #00ffff;
    padding:10px 15px;
    border-radius:20px;
    font-size:14px;
}

/* FRASE */
#frase{
    color:#00ffff;
    text-align:center;
    margin-bottom:10px;
}
</style>
</head>

<body>

<div id="frase"></div>

<video id="video" autoplay playsinline>
    <source src="crimen.mp4" type="video/mp4">
</video>

<div class="botones">
    <button onclick="mostrarFrase()">✨ Frases Cerati</button>
    <button onclick="modoCrimen()">🖤 Modo Crimen</button>
</div>

<script>
const frases=[
"El arte es transformar el dolor en algo bello.",
"La música abre puertas que nadie puede cerrar.",
"Siempre hay algo nuevo esperando ser descubierto."
];

function mostrarFrase(){
    let r=Math.floor(Math.random()*frases.length);
    document.getElementById("frase").innerText=frases[r];
}

function modoCrimen(){
    let v=document.getElementById("video");
    v.style.filter = v.style.filter ? "" : "brightness(0.6) contrast(1.3)";
}
</script>

</body>
</html>
