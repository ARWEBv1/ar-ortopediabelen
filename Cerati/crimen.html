<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crimen - Cerati</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
}

/* VIDEO */
#video{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    object-fit:contain;
    background:black;
    z-index:1;
}

/* CAPA HOLOGRAMA SIMPLE */
.holograma{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,255,255,0.08);
    z-index:2;
    pointer-events:none;
}

/* BOTONES */
.botones{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:15px;
    z-index:10; /* SIEMPRE ARRIBA */
}

button{
    background:rgba(0,0,0,0.6);
    color:#00ffff;
    border:1px solid #00ffff;
    padding:12px 18px;
    border-radius:20px;
    font-size:15px;
    cursor:pointer;
}

/* FRASE */
#frase{
    position:fixed;
    top:20px;
    width:100%;
    text-align:center;
    color:#00ffff;
    font-size:24px;
    text-shadow:0 0 10px cyan;
    z-index:11;
}
</style>
</head>

<body>

<div id="frase"></div>

<video id="video" autoplay playsinline controls>
    <source src="crimen.mp4" type="video/mp4">
</video>

<div class="holograma"></div>

<div class="botones">
    <button onclick="mostrarFrase()">✨ Frases Cerati</button>
    <button onclick="modoCrimen()">🖤 Modo Crimen</button>
</div>

<script>
const frases = [
"El arte es transformar el dolor en algo bello.",
"La música abre puertas que nadie puede cerrar.",
"Siempre hay algo nuevo esperando ser descubierto."
];

function mostrarFrase(){
    const r = Math.floor(Math.random()*frases.length);
    document.getElementById("frase").innerText = frases[r];
}

function modoCrimen(){
    const v = document.getElementById("video");
    v.style.filter = v.style.filter ? "" : "brightness(0.6) contrast(1.3)";
}
</script>

</body>
</html>
