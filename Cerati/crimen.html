<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crimen - Cerati</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
}

#container{
    position:relative;
    width:100%;
    height:100%;
}

/* VIDEO */
video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:contain;
    background:black;
}

/* UI ENCIMA */
#ui{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
}

/* BOTONES */
.botones{
    position:absolute;
    bottom:30px;
    width:100%;
    display:flex;
    justify-content:center;
    gap:15px;
}

button{
    padding:12px 18px;
    background:rgba(0,0,0,0.7);
    color:#00ffff;
    border:1px solid #00ffff;
    border-radius:20px;
    font-size:15px;
}

/* FRASE */
#frase{
    position:absolute;
    top:20px;
    width:100%;
    text-align:center;
    color:#00ffff;
    font-size:22px;
}
</style>
</head>

<body>

<div id="container">

<video id="video" autoplay playsinline>
    <source src="crimen.mp4" type="video/mp4">
</video>

<div id="ui">

<div id="frase"></div>

<div class="botones">
    <button onclick="mostrarFrase()">✨ Frases Cerati</button>
    <button onclick="modoCrimen()">🖤 Modo Crimen</button>
</div>

</div>
</div>

<script>
const frases=[
"El arte es transformar el dolor en algo bello.",
"La música abre puertas que nadie puede cerrar.",
"Siempre hay algo nuevo esperando ser descubierto."
];

function mostrarFrase(){
    const r=Math.floor(Math.random()*frases.length);
    document.getElementById("frase").innerText=frases[r];
}

function modoCrimen(){
    const v=document.getElementById("video");
    v.style.filter=v.style.filter ? "" : "brightness(0.6) contrast(1.3)";
}
</script>

</body>
</html>
