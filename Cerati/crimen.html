<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crimen - Cerati</title>

<style>
html, body{
    margin:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* VIDEO */
video{
    width:100vw;
    height:100vh;
    object-fit:contain;
    background:black;
}

/* BOTONES */
.botones{
    position:absolute;
    bottom:30px;
    display:flex;
    gap:15px;
}

button{
    background:rgba(255,255,255,0.15);
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:20px;
    cursor:pointer;
    font-size:14px;
    backdrop-filter:blur(5px);
}

button:hover{
    background:rgba(255,255,255,0.3);
}

/* TEXTO FRASES */
#frase{
    position:absolute;
    top:40px;
    color:white;
    font-size:22px;
    font-family:Arial;
    text-align:center;
    padding:10px;
    max-width:80%;
}

/* EFECTO CRIMEN */
.modoCrimen{
    filter:brightness(0.6) contrast(1.3);
}
</style>
</head>

<body>

<div id="frase"></div>

<video id="video" autoplay playsinline controls>
    <source src="crimen.mp4" type="video/mp4">
</video>

<div class="botones">
    <button onclick="mostrarFrase()">✨ Frases Cerati</button>
    <button onclick="modoCrimen()">🖤 Modo Crimen</button>
</div>

<script>
const frases = [
"El arte es transformar el dolor en algo bello.",
"La música abre puertas que nadie puede cerrar.",
"Siempre hay algo nuevo esperando ser descubierto."
];

function mostrarFrase(){
    const random = frases[Math.floor(Math.random()*frases.length)];
    document.getElementById("frase").innerText = random;
}

function modoCrimen(){
    document.getElementById("video").classList.toggle("modoCrimen");
}
</script>

</body>
</html>
